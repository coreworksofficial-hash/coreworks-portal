  <style>

    .btn-rakuten {

      padding: 11px; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(191, 0, 0, 0.3);

<body>
  <div class="container">
    <a href="../" class="back-link">← トップへ戻る</a>
    <h1>⚡ これ何ヶ月で元が取れる？計算機</h1>
    <p class="lead">気になるアイテムをタップするだけ！元取り期間と5年後の黒字額が1秒でわかります。</p>

    <!-- 1. アイコンボタン（タップで即切り替え） -->
    <div class="preset-grid" id="presetGrid"></div>

    <!-- 2. ドカンと結論 -->
    <div class="verdict-box">
      <div class="v-label" id="vLabel">🚿 節水シャワーヘッド（実質 14,850円）は…</div>
      <div class="v-main" id="vMain">約 8.3 ヶ月で元が取れる！</div>
      <div class="v-kpis">
        <div class="v-kpi">
          <div class="v-kpi-lbl">毎月のプラス効果</div>
          <div class="v-kpi-val" id="vMonthly" style="color:var(--green);">+1,800 円/月</div>
        </div>
        <div class="v-kpi">
          <div class="v-kpi-lbl">5年間の純利益（黒字）</div>
          <div class="v-kpi-val" id="v5Year" style="color:var(--amber);">+93,150 円</div>
        </div>
      </div>
    </div>

    <!-- 3. スライダー2本だけの直感調整 -->
    <div class="sliders-card">
      <div class="s-row">
        <div class="s-head">
          <span>💰 商品の価格（楽天10%還元考慮）</span>
          <span class="s-val" id="lblPrice">16,500 円</span>
        </div>
        <input type="range" id="rngPrice" min="2000" max="250000" step="1000" value="16500" oninput="calc()">
      </div>
      <div class="s-row">
        <div class="s-head">
          <span>✨ 毎月浮く金額（節約額＋時短価値）</span>
          <span class="s-val" id="lblSave" style="color:var(--green);">月 1,800 円</span>
        </div>
        <input type="range" id="rngSave" min="500" max="30000" step="500" value="1800" oninput="calc()">
      </div>
    </div>

    <!-- 4. 最短で元が取れる鉄板モデル3選 -->
    <div class="rec-title" id="recTitle">🏆 節水シャワーヘッドの元取りモデル3選</div>
    <div class="rec-list" id="recList"></div>
  </div>

  <script>
    const AID = '5876771';
    const PID = '54';
    function rakutenUrl(q) {
      return 'https://af.moshimo.com/af/c/click?a_id=' + AID + '&p_id=' + PID + '&pc_id=54&pl_id=616&url=' +
        encodeURIComponent('https://search.rakuten.co.jp/search/mall/' + encodeURIComponent(q) + '/');
    }

    const PRESETS = [
      {
        id: 'shower', icon: '🚿', name: '節水シャワー', tag: '水道・ガス代 -40%',
        price: 16500, save: 1800,
        recs: [
          { badge: '👑 一番人気・王道', best: true, name: 'MYTREX / ReFa ファインバブル節水シャワー', pb: '約8ヶ月で元取り', desc: '毛穴ケアと最大50%節水を両立。4人家族なら約4ヶ月で回収！', q: 'ファインバブル シャワーヘッド 節水' },
          { badge: '手軽導入モデル', name: 'アラミック シルキーナノバブルシャワー', pb: '約3ヶ月で元取り', desc: '手元止水スイッチ付き。6,000円前後で買えて一人暮らしでも即回収。', q: 'アラミック 節水シャワーヘッド' }
        ]
      },
      {
        id: 'dishwasher', icon: '🍽️', name: '工事不要食洗機', tag: '毎日20分の皿洗い消滅',
        price: 38000, save: 9500,
        recs: [
          { badge: '👑 一番人気・王道', best: true, name: 'Panasonic SOLOTA / シロカ タンク式食洗機', pb: '時短込み約3.5ヶ月で元取り', desc: '工事不要で届いた日に使える。手洗いより節水＆冬の手荒れもゼロに！', q: '食洗機 工事不要 タンク式 パナソニック シロカ' },
          { badge: 'ファミリー大容量', name: 'Panasonic 卓上型食器洗い乾燥機', pb: '約5ヶ月で元取り', desc: 'フライパンまで丸洗い。5年間で300時間以上の自由時間を生み出します。', q: 'パナソニック 食器洗い乾燥機 卓上' }
        ]
      },
      {
        id: 'coffee_bottle', icon: '☕', name: '水筒＆おうち珈琲', tag: 'コンビニ・カフェ代8割減',
        price: 15000, save: 6000,
        recs: [
          { badge: '👑 最短2週間で回収', best: true, name: '象印 シームレスせん 食洗機対応マイボトル', pb: '約2週間で元取り！', desc: 'パッキン一体型で洗うのが超ラク。毎日160円のペットボトル代がゼロに。', q: '象印 シームレスせん 水筒 食洗機対応' },
          { badge: '1杯25円の挽きたて', name: 'シロカ / デロンギ 全自動コーヒーメーカー', pb: '約2.5ヶ月で元取り', desc: 'ボタン1つで豆から挽きたて。コンビニやカフェ通いを卒業して年6万円黒字化。', q: '全自動コーヒーメーカー ミル付き' }
        ]
      },
      {
        id: 'soda', icon: '🫧', name: '炭酸水メーカー', tag: '500ml約18円・ゴミ0',
        price: 15000, save: 3000,
        recs: [
          { badge: '👑 コスパ最強No.1', best: true, name: 'ドリンクメイト / ソーダストリーム スターター', pb: '約4.5ヶ月で元取り', desc: 'ペットボトル箱買いとゴミ捨てから一生解放。強炭酸ハイボール派に必須！', q: 'ソーダストリーム ドリンクメイト スターターキット' }
        ]
      },
      {
        id: 'robot_vac', icon: '🤖', name: 'ロボット掃除機', tag: '掃除機＆水拭き自動化',
        price: 55000, save: 11000,
        recs: [
          { badge: '👑 全自動コスパ王', best: true, name: 'Anker Eufy / SwitchBot ゴミ収集＆水拭き機', pb: '時短込み約4.5ヶ月で回収', desc: 'ゴミ捨てすら2ヶ月に1回でOK。毎日床がサラサラに保たれます。', q: 'ロボット掃除機 自動ゴミ収集 水拭き Anker SwitchBot' }
        ]
      },
      {
        id: 'drum_washer', icon: '🧺', name: 'ドラム式洗濯機', tag: '干す・取り込む家事消滅',
        price: 168000, save: 15000,
        recs: [
          { badge: '👑 電気代が安いヒートポンプ', best: true, name: '東芝 ZABOON / SHARP / Panasonic ドラム式', pb: '時短込み約10ヶ月で回収', desc: '1回約30円の電気代でフワフワ乾燥。7年間で1,500時間以上の時短に！', q: 'ドラム式洗濯乾燥機 ヒートポンプ' }
        ]
      }
    ];

    let cur = PRESETS[0];

    function renderPresets() {
      document.getElementById('presetGrid').innerHTML = PRESETS.map(p => `
        <button type="button" class="p-btn ${p.id === cur.id ? 'active' : ''}" onclick="selectPreset('${p.id}')">
          <span class="p-icon">${p.icon}</span>
          <div style="min-width:0;">
            <div class="p-name">${p.name}</div>
            <div class="p-tag">${p.tag}</div>
          </div>
        </button>
      `).join('');
    }

    function selectPreset(id) {
      const found = PRESETS.find(x => x.id === id);
      if (!found) return;
      cur = found;
      document.getElementById('rngPrice').value = cur.price;
      document.getElementById('rngSave').value = cur.save;
      renderPresets();
      renderRecs();
      calc();
    }

    function renderRecs() {
      document.getElementById('recTitle').textContent = `🏆 ${cur.name}の元取り鉄板モデル`;
      document.getElementById('recList').innerHTML = cur.recs.map(r => `
        <div class="rec-card ${r.best ? 'best' : ''}">
          <div class="rec-top">
            <span class="rec-badge">${r.badge}</span>
            <span class="rec-payback">⚡ ${r.pb}</span>
          </div>
          <div class="rec-name">${r.name}</div>
          <div class="rec-desc">${r.desc}</div>
          <a href="${rakutenUrl(r.q)}" target="_blank" rel="nofollow sponsored noopener" class="btn-rakuten">🛍️ 楽天市場で最安値・還元を見る ↗</a>
        </div>
      `).join('');
    }

    function calc() {
      const price = Number(document.getElementById('rngPrice').value) || 0;
      const save = Number(document.getElementById('rngSave').value) || 500;
      const netCost = Math.round(price * 0.9); // 楽天10%還元考慮

      document.getElementById('lblPrice').textContent = `${price.toLocaleString()} 円（実質 ${netCost.toLocaleString()}円）`;
      document.getElementById('lblSave').textContent = `月 ${save.toLocaleString()} 円`;

      const months = netCost / save;
      const profit5Y = (save * 60) - netCost;

      document.getElementById('vLabel').textContent = `${cur.icon} ${cur.name}（実質 ${netCost.toLocaleString()}円）は…`;
      document.getElementById('vMain').textContent = months < 1
        ? `約 ${Math.max(1, Math.round(months * 30))} 日で元が取れる！`
        : `約 ${months.toFixed(1)} ヶ月で元が取れる！`;
      document.getElementById('vMonthly').textContent = `+${save.toLocaleString()} 円/月`;
      document.getElementById('v5Year').textContent = (profit5Y >= 0 ? '+' : '') + profit5Y.toLocaleString() + ' 円';
    }

    (function init() {
      const q = new URLSearchParams(window.location.search).get('p');
      if (q && PRESETS.some(x => x.id === q)) {
        selectPreset(q);
      } else {
        renderPresets();
        renderRecs();
        calc();
      }
    })();
  </script>
