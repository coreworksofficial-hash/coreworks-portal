<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冬の暖房費「いくら浮く？」節電チェッカー ｜ Coreworks Studio</title>
  <meta name="description" content="エアコンやヒーターの電気代と、電気毛布（1時間0.9円）・着る毛布・窓断熱を併用した時にひと冬でいくら浮くかをワンタップで計算します。">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "冬の暖房で一番電気代が安いのは何ですか？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "1時間あたり約0.9円の「電気毛布」が最安です。エアコン（約22円/時）やセラミックヒーター（約34円/時）と比べ、ひと冬で1万円以上節約できます。"
        }
      }
    ]
  }
  </script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --border: #263554;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --orange: #fb923c;
      --rose: #fb7185;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; line-height: 1.45; }
    .container { max-width: 640px; margin: 0 auto; padding: 16px 14px 60px; }
    .back-link { display: inline-block; margin-bottom: 10px; color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 700; }
    h1 { font-size: 1.45rem; font-weight: 900; margin-bottom: 4px; color: #fff; }
    .lead { color: var(--muted); font-size: 0.83rem; margin-bottom: 14px; }

    /* 1. 結論（最上部） */
    .hero-box {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.18), rgba(56, 189, 248, 0.1));
      border: 2px solid var(--green);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      margin-bottom: 16px;
    }
    .h-lbl { font-size: 0.8rem; color: #cbd5e1; font-weight: 700; }
    .h-main { font-size: 2.1rem; font-weight: 900; color: var(--green); margin: 4px 0; }
    .h-sub { font-size: 0.8rem; color: #fff; background: rgba(11,15,25,0.65); padding: 8px; border-radius: 8px; margin-top: 6px; }

    /* 2. 暖房選択＆併用チップ */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .row-lbl { display: flex; justify-content: space-between; font-size: 0.84rem; font-weight: 800; margin-bottom: 8px; }
    select { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 0.92rem; font-weight: 700; margin-bottom: 12px; }
    input[type="range"] { width: 100%; accent-color: var(--orange); height: 6px; cursor: pointer; }

    .chips-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .chip {
      background: #0b0f19; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-width: 0;
    }
    .chip.on { background: rgba(52, 211, 153, 0.15); border-color: var(--green); }
    .c-name { font-size: 0.8rem; font-weight: 800; color: #fff; }
    .c-sub { font-size: 0.7rem; color: var(--green); font-weight: 700; }
    .c-chk { width: 18px; height: 18px; border-radius: 99px; border: 1.5px solid #475569; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; flex-shrink: 0; }
    .chip.on .c-chk { background: var(--green); border-color: var(--green); color: #0b0f19; font-weight: 900; }

    /* 3. おすすめグッズタイル */
    .sec-title { font-size: 0.96rem; font-weight: 900; margin-bottom: 10px; color: #fff; }
    .goods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .g-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 10px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .g-tag { font-size: 0.68rem; font-weight: 800; color: var(--orange); margin-bottom: 4px; }
    .g-title { font-size: 0.84rem; font-weight: 800; color: #fff; margin-bottom: 4px; line-height: 1.3; }
    .g-roi { font-size: 0.72rem; color: var(--green); font-weight: 700; margin-bottom: 8px; }
    .btn-rakuten { display: block; text-align: center; background: linear-gradient(135deg, #df0000, #b80000); color: #fff; text-decoration: none; font-weight: 800; font-size: 0.76rem; padding: 8px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="../" class="back-link">← トップへ戻る</a>
    <h1>🧣 冬の暖房費 いくら浮く？計算機</h1>
    <p class="lead">電気毛布（1h 0.9円）や着る毛布を併用すると、ひと冬でいくら浮くかを1秒計算。</p>

    <!-- 1. 結論 -->
    <div class="hero-box">
      <div class="h-lbl">ひと冬（4ヶ月）で浮く電気代</div>
      <div class="h-main" id="resSaved">+12,400 円 お得！</div>
      <div class="h-sub" id="resSub">対策なし 23,760円 ➔ 併用後 11,360円（約35日でグッズ代の元が取れる！）</div>
    </div>

    <!-- 2. 操作パネル -->
    <div class="card">
      <div class="row-lbl"><span>🌡️ いま使っているメイン暖房</span></div>
      <select id="inType" onchange="calc()">
        <option value="0.7" selected>エアコン暖房（1時間 約22円）</option>
        <option value="1.1">セラミックヒーター（1時間 約34円）</option>
        <option value="0.9">オイルヒーター（1時間 約28円）</option>
      </select>

      <div class="row-lbl">
        <span>⏰ 1日に使う時間</span>
        <span style="color:var(--orange);" id="lblHours">9 時間/日</span>
      </div>
      <input type="range" id="inHours" min="2" max="24" step="1" value="9" oninput="calc()">

      <div class="row-lbl" style="margin-top:14px;"><span>👇 併用する節電グッズ（タップでON/OFF）</span></div>
      <div class="chips-grid" id="chipsGrid"></div>
    </div>

    <!-- 3. 節電グッズ4選 -->
    <div class="sec-title">🔥 初月で元が取れる「冬の節電神器」4選</div>
    <div class="goods-grid" id="goodsGrid"></div>
  </div>

  <script>
    const AID = '5876771';
    const PID = '54';
    function rakutenUrl(q) {
      return 'https://af.moshimo.com/af/c/click?a_id=' + AID + '&p_id=' + PID + '&pc_id=54&pl_id=616&url=' +
        encodeURIComponent('https://search.rakuten.co.jp/search/mall/' + encodeURIComponent(q) + '/');
    }

    const COMBOS = [
      { name: '⚡ 電気毛布', sub: '1h 0.9円 (-32%)', cut: 0.32, cost: 3980, kw: 0.03, on: true },
      { name: '🧥 着る毛布', sub: '電気代0円 (-18%)', cut: 0.18, cost: 3200, kw: 0, on: true },
      { name: '🪟 窓断熱シート', sub: '熱逃げ防止 (-12%)', cut: 0.12, cost: 1800, kw: 0, on: false },
      { name: '🧦 こたつソックス', sub: '足元保温 (-8%)', cut: 0.08, cost: 1980, kw: 0, on: false }
    ];

    const GOODS = [
      { tag: '👑 1時間0.9円の神暖房', title: '丸洗いOK フランネル電気毛布', roi: '約3週間で元取り！', q: '電気毛布 掛け敷き 丸洗い フランネル' },
      { tag: '💻 足元がこたつ化', title: '5面遠赤外線 デスク下パネルヒーター', roi: '約1ヶ月で元取り！', q: 'パネルヒーター デスク下 足元 5面' },
      { tag: '🧥 電気代永久0円', title: 'グルーニー / モフア 着る毛布', roi: '羽織るだけで設定-2℃', q: '着る毛布 グルーニー モフア' },
      { tag: '🧦 毎年完売の定番', title: '靴下サプリ まるでこたつソックス', roi: '足首のツボを温熱刺激', q: 'まるでこたつソックス 靴下サプリ' }
    ];

    function renderChips() {
      document.getElementById('chipsGrid').innerHTML = COMBOS.map((c, i) => `
        <div class="chip ${c.on ? 'on' : ''}" onclick="toggleCombo(${i})">
          <div style="min-width:0;">
            <div class="c-name">${c.name}</div>
            <div class="c-sub">${c.sub}</div>
          </div>
          <div class="c-chk">${c.on ? '✓' : ''}</div>
        </div>
      `).join('');
    }

    function toggleCombo(i) {
      COMBOS[i].on = !COMBOS[i].on;
      renderChips();
      calc();
    }

    function renderGoods() {
      document.getElementById('goodsGrid').innerHTML = GOODS.map(g => `
        <div class="g-card">
          <div>
            <div class="g-tag">${g.tag}</div>
            <div class="g-title">${g.title}</div>
            <div class="g-roi">⚡ ${g.roi}</div>
          </div>
          <a href="${rakutenUrl(g.q)}" target="_blank" rel="nofollow sponsored noopener" class="btn-rakuten">🛍️ 楽天で見る ↗</a>
        </div>
      `).join('');
    }

    function calc() {
      const baseKw = Number(document.getElementById('inType').value) || 0.7;
      const hours = Number(document.getElementById('inHours').value) || 9;
      document.getElementById('lblHours').textContent = `${hours} 時間/日`;

      const rate = 31;
      const days = 120;
      const beforeDaily = baseKw * hours * rate;
      const beforeWinter = Math.round(beforeDaily * days);

      let cut = 0, invest = 0, extraKw = 0;
      COMBOS.forEach(c => {
        if (c.on) { cut += c.cut; invest += c.cost; extraKw += c.kw; }
      });
      cut = Math.min(0.65, cut);

      const afterDaily = beforeDaily * (1 - cut) + (extraKw * hours * rate);
      const afterWinter = Math.round(afterDaily * days);
      const saved = Math.max(0, beforeWinter - afterWinter);
      const dailySaved = Math.max(0, beforeDaily - afterDaily);
      const paybackDays = dailySaved > 0 ? Math.round(invest / dailySaved) : 0;

      document.getElementById('resSaved').textContent = `+${saved.toLocaleString()} 円 お得！`;
      document.getElementById('resSub').textContent = dailySaved > 0
        ? `対策なし ${beforeWinter.toLocaleString()}円 ➔ 併用後 ${afterWinter.toLocaleString()}円（約${paybackDays}日でグッズ代の元が取れる！）`
        : '併用グッズを1つ以上タップして選んでください';
    }

    renderChips();
    renderGoods();
    calc();
  </script>

</div>
</body>
