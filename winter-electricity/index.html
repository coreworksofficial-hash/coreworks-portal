      calc();
    }

    function renderGoods() {
      document.getElementById('goodsGrid').innerHTML = GOODS.map(g => `
        <div class="g-card">
          <div>
            <div class="g-tag">${g.tag}</div>
            <div class="g-title">${g.title}</div>
            <div class="g-roi"><svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> ${g.roi}</div>
          </div>
          <a href="${g.url || rakutenUrl(g.q)}" target="_blank" rel="nofollow sponsored noopener" class="btn-rakuten">${g.btn || '<svg class="svg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> 楽天で見る ↗'}</a>
        </div>
      `).join('');
    }

    function calc() {
      const baseKw = Number(document.getElementById('inType').value) || 0.7;
      const hours = Number(document.getElementById('inHours').value) || 9;
      document.getElementById('lblHours').innerHTML = `${hours} 時間/日`;

      const rate = 31;
      const days = 120;
      const beforeDaily = baseKw * hours * rate;
      const beforeWinter = Math.round(beforeDaily * days);

      let cut = 0, invest = 0, extraKw = 0;
      COMBOS.forEach(c => {
        if (c.on) { cut += c.cut; invest += c.cost; extraKw += c.kw; }
      });
      cut = Math.min(0.65, cut);

      const afterDaily = beforeDaily * (1 - cut) + (extraKw * hours * rate);
      const afterWinter = Math.round(afterDaily * days);
      const saved = Math.max(0, beforeWinter - afterWinter);
      const dailySaved = Math.max(0, beforeDaily - afterDaily);
      const paybackDays = dailySaved > 0 ? Math.round(invest / dailySaved) : 0;

      document.getElementById('resSaved').innerHTML = `+${saved.toLocaleString()} 円 お得！`;
      document.getElementById('resSub').innerHTML = dailySaved > 0
        ? `対策なし ${beforeWinter.toLocaleString()}円 併用後 ${afterWinter.toLocaleString()}円（約${paybackDays}日でグッズ代の元が取れる！）`
        : '併用グッズを1つ以上タップして選んでください';
    }

    renderChips();
    renderGoods();
    calc();
  </script>
