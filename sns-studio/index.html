  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --border: #263554;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; line-height: 1.45; }
    .container { max-width: 680px; margin: 0 auto; padding: 16px 14px 60px; }
    .back-link { display: inline-block; margin-bottom: 10px; color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 700; }
    h1 { font-size: 1.45rem; font-weight: 900; margin-bottom: 4px; color: #fff; }
    .lead { color: var(--muted); font-size: 0.84rem; margin-bottom: 18px; }

    .card-list { display: flex; flex-direction: column; gap: 22px; }
    .v-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px 14px;
    }
    .v-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .v-title { font-size: 1.02rem; font-weight: 900; color: #fff; }
    .v-badge { font-size: 0.7rem; font-weight: 800; background: rgba(56,189,248,0.16); color: var(--accent); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

    .img-wrap {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      background: #000;
    }
    .img-wrap img { width: 100%; height: auto; display: block; }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 8px; border-radius: 10px; font-size: 0.82rem; font-weight: 800;
      text-decoration: none; cursor: pointer; border: none; text-align: center;
    }
    .btn-x { background: #1d9bf0; color: #fff; }
    .btn-copy { background: #1e293b; color: var(--accent); border: 1px solid var(--accent); }
    .btn-rakuten {
      grid-column: 1 / -1;
      background: #1e293b; border: 1px solid #475569;
      color: #cbd5e1; padding: 10px; border-radius: 10px; font-size: 0.875rem; font-weight: 600; text-decoration: none; text-align: center; display: block;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: #052e16; font-weight: 900; font-size: 0.85rem;
      padding: 10px 20px; border-radius: 99px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none; z-index: 999;
    }
  </style>
</head>
<body>

    <div class="card-list" id="cardList"></div>

      },
      {
        title: '④ 毎月のサブスク「10年間で消える総額」',
        badge: '固定費見直し',
        img: '../visuals/04_subscription_10years.png',

      }
    ];

    function copyText(idx) {
      navigator.clipboard.writeText(ITEMS[idx].post);
      const t = document.getElementById('toast');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    function render() {
      document.getElementById('cardList').innerHTML = ITEMS.map((it, i) => {
        const xIntent = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(it.post);
        return `
          <div class="v-card">
            <div class="v-head">
              <div class="v-title">${it.title}</div>
              <span class="v-badge">${it.badge}</span>
            </div>
            <div class="img-wrap">
              <img src="${it.img}" alt="${it.title}" loading="lazy">
            </div>
            <div class="btn-group">
              <a href="${xIntent}" target="_blank" rel="noopener" class="btn btn-x">🚀 Xで投稿画面を開く</a>
              <button type="button" class="btn btn-copy" onclick="copyText(${i})">📋 文章をコピー</button>
              <a href="${rakutenUrl(it.q)}" target="_blank" rel="nofollow sponsored noopener" class="btn-rakuten">${it.rakutenLabel}</a>
            </div>
          </div>
        `;
      }).join('');
    }
    render();
  </script>
