<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サブスク固定費・年間損益シミュレーター ｜ Coreworks Studio</title>
  <meta name="description" content="月額契約している動画・音楽・ジム・クラウド等のサブスクを一覧化し、年間支払額と10年間の投資機会損失（年利5%）を即時計算します。">
  <style>
    body { background: #0b0f19; color: #f1f5f9; font-family: sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    .card { background: #151d30; border: 1px solid #23314e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .item-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
    input[type="text"] { flex: 2; padding: 10px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    input[type="number"] { flex: 1; padding: 10px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 6px; }
    button { background: #38bdf8; color: #0b0f19; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-del { background: #ef4444; color: #fff; padding: 8px 12px; }
    .btn-add { background: #1e293b; color: #38bdf8; border: 1px dashed #38bdf8; width: 100%; margin-top: 10px; }
    .result-box { background: rgba(56,189,248,0.1); border: 2px solid #38bdf8; border-radius: 12px; padding: 20px; text-align: center; }
    .res-val { font-size: 2.2rem; font-weight: 900; color: #38bdf8; margin: 8px 0; }
    .back-link { display: inline-block; margin-bottom: 16px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <a href="../" class="back-link">← Coreworks Studio トップへ戻る</a>
  <h1>✂️ サブスク固定費・年間損益シミュレーター</h1>
  <p>毎月なんとなく引き落とされている月額サービスを書き出すだけで、年間総支払額と「もし投資していた場合の10年後の未来資産」を瞬時に可視化します。</p>

  <div class="card" id="listCard">
    <div id="itemsContainer">
      <div class="item-row">
        <input type="text" value="動画配信サブスク (Netflix等)" placeholder="サービス名">
        <input type="number" value="1490" placeholder="月額(円)" class="price-input" oninput="calc()">
        <button class="btn-del" onclick="this.parentElement.remove(); calc();">削除</button>
      </div>
      <div class="item-row">
        <input type="text" value="音楽配信 (Spotify等)" placeholder="サービス名">
        <input type="number" value="980" placeholder="月額(円)" class="price-input" oninput="calc()">
        <button class="btn-del" onclick="this.parentElement.remove(); calc();">削除</button>
      </div>
      <div class="item-row">
        <input type="text" value="24時間ジム会費" placeholder="サービス名">
        <input type="number" value="7480" placeholder="月額(円)" class="price-input" oninput="calc()">
        <button class="btn-del" onclick="this.parentElement.remove(); calc();">削除</button>
      </div>
    </div>
    <button class="btn-add" onclick="addRow()">＋ サービスを追加する</button>
  </div>

  <div class="result-box">
    <div>月々のサブスク合計</div>
    <div class="res-val" id="resMonthly">0 円</div>
    <div style="font-size:0.95rem; color:#cbd5e1; margin-top:10px;">
      1年間の支払総額: <strong id="resYearly" style="color:#f472b6;">0 円</strong><br>
      もし月々同額をインデックス投資（年利5%）に回した場合の10年後の資産: <strong id="resInvest" style="color:#34d399;">0 円</strong>
    </div>
  </div>

  <script>
    function addRow() {
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = '<input type="text" placeholder="サービス名"><input type="number" value="1000" placeholder="月額(円)" class="price-input" oninput="calc()"><button class="btn-del" onclick="this.parentElement.remove(); calc();">削除</button>';
      document.getElementById('itemsContainer').appendChild(div);
      calc();
    }
    function calc() {
      const inputs = document.querySelectorAll('.price-input');
      let monthly = 0;
      inputs.forEach(i => monthly += (Number(i.value) || 0));
      const yearly = monthly * 12;
      // 10年複利 (年利5%・毎月積立)
      const r = 0.05 / 12;
      const n = 120;
      const future = monthly * ((Math.pow(1 + r, n) - 1) / r);
      document.getElementById('resMonthly').innerText = monthly.toLocaleString() + ' 円';
      document.getElementById('resYearly').innerText = yearly.toLocaleString() + ' 円';
      document.getElementById('resInvest').innerText = Math.round(future).toLocaleString() + ' 円';
    }
    calc();
  </script>
