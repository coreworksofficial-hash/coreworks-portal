<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff4500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>爆盛！どんぶりタワー 〜店長、天井突き抜けてます〜</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
  }
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html.android-apk {
    --safe-top: max(env(safe-area-inset-top, 0px), 40px);
    --safe-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0d00;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: #2b1505;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }
  /* Top Navigation & Status Bar */
  #topbar {
    background: linear-gradient(180deg, #b31b00 0%, #7a0f00 100%);
    border-bottom: 3px solid #ffcc00;
    padding: calc(var(--safe-top) + 6px) 10px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    z-index: 20;
    flex-shrink: 0;
  }
  .brand {
    font-weight: 900;
    font-size: 14px;
    color: #ffe600;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .currency-box {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
  }
  .kcal-pill {
    background: rgba(0,0,0,0.55);
    border: 1.5px solid #ffcc00;
    border-radius: 99px;
    padding: 2px 10px;
    color: #ffeb3b;
  }
  .icon-btn {
    background: #ffcc00;
    color: #3a1500;
    border: 2px solid #000;
    border-radius: 8px;
    padding: 3px 8px;
    font-weight: 900;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 2px 0 #000;
  }
  .icon-btn:active {
    transform: translateY(2px);
    box-shadow: none;
  }

  /* Mode Switch Tabs */
  #mode-tabs {
    display: flex;
    background: #3d1c04;
    border-bottom: 2px solid #8a4b19;
    z-index: 20;
    flex-shrink: 0;
  }
  .mode-tab {
    flex: 1;
    text-align: center;
    padding: 7px 2px;
    font-size: 11.5px;
    font-weight: 900;
    color: #f3c69f;
    background: #2e1402;
    border-right: 1px solid #5c2c0c;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-tab:last-child { border-right: none; }
  .mode-tab.active {
    background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
    color: #fff;
    text-shadow: 1px 1px 0 #000;
    box-shadow: inset 0 -3px 0 #fff59d;
  }

  /* Canvas Container */
  #stage-wrap {
    position: relative;
    flex: 1;
    width: 100%;
    overflow: hidden;
    background: #fff3e0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* In-game Floating HUD */
  #hud-overlay {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
  }
  .hud-card {
    background: rgba(0, 0, 0, 0.68);
    border: 2px solid #ffcc00;
    border-radius: 10px;
    padding: 5px 10px;
    color: #fff;
    font-weight: 900;
    font-size: 12px;
    line-height: 1.35;
    text-shadow: 1px 1px 0 #000;
  }
  .hud-big {
    font-size: 18px;
    color: #ffeb3b;
  }
  #substyle-btn {
    pointer-events: auto;
    background: linear-gradient(180deg, #4caf50, #2e7d32);
    color: #fff;
    border: 2px solid #fff;
    border-radius: 10px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 900;
    box-shadow: 0 3px 0 #1b5e20;
    cursor: pointer;
  }
  #substyle-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #1b5e20;
  }

  /* Bottom Quick Action / Upgrade Drawer */
  #bottom-bar {
    background: linear-gradient(180deg, #2d1404 0%, #170900 100%);
    border-top: 3px solid #ff9800;
    padding: 6px 8px calc(var(--safe-bottom) + 8px);
    display: flex;
    gap: 6px;
    z-index: 20;
    flex-shrink: 0;
  }
  .upg-btn {
    flex: 1;
    background: linear-gradient(180deg, #fff8e1 0%, #ffe082 100%);
    border: 2px solid #5d4037;
    border-radius: 10px;
    padding: 5px 4px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 3px 0 #3e2723;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  .upg-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #3e2723;
  }
  .upg-btn.disabled {

  }
  .upg-title {
    font-size: 11px;
    font-weight: 900;
    color: #3e2723;
  }
  .upg-cost {
    font-size: 10px;
    font-weight: 800;
    color: #d84315;
    margin-top: 1px;
  }

  /* Modal Overlay (Encyclopedia / Title / Result) */
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;

  .modal-backdrop.show {
    display: flex;
  }
  .modal-card {
    width: 100%;
    max-height: 86%;

    border-radius: 18px;
    padding: 14px;

    font-weight: 900;
    color: #bf360c;
  }
  .modal-body {
    overflow-y: auto;

    padding-right: 4px;

  .grid-list {
    display: grid;

  .dex-item {
    background: #fff;

    text-align: center;

  .dex-emoji {

    box-shadow: 0 4px 0 #000;
  }
  .big-cta:active {
    transform: translateY(3px);

</style>

  // ==========================================================================
  // 1. Procedural Sound & BGM Synthesizer (Web Audio API - Zero External Files)
  // ==========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
      this.bgmTimer = null;
      this.bgmStep = 0;
    }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    vibrate(ms) {
      try {
        if (navigator.vibrate) navigator.vibrate(ms);
      } catch (e) {}
    }
    playTone(freq, type = 'sine', duration = 0.12, vol = 0.18, slideTo = null) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
      }
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }
    sfxCatch(combo = 1) {
      const base = 320 + Math.min(combo * 35, 600);
      this.playTone(base, 'triangle', 0.11, 0.22, base * 1.45);
      this.vibrate(18);
    }
    sfxDrop() {
      this.playTone(420, 'sine', 0.08, 0.14, 220);
    }
    sfxBomb() {
      this.playTone(140, 'sawtooth', 0.35, 0.3, 32);
      this.vibrate([40, 30, 80]);
    }
    sfxFever() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => {
        setTimeout(() => this.playTone(n, 'square', 0.14, 0.18, n * 1.05), i * 65);
      });
      this.vibrate([30, 20, 50]);
    }
    sfxCollapse() {
      const notes = [380, 310, 240, 150];
      notes.forEach((n, i) => {
        setTimeout(() => this.playTone(n, 'sawtooth', 0.18, 0.22, n * 0.7), i * 80);
      });
      this.vibrate([60, 40, 100]);
    }
    sfxPop() {
      this.playTone(580 + Math.random() * 280, 'sine', 0.06, 0.2, 980);
      this.vibrate(12);
    }
    sfxStamp() {
      this.playTone(160, 'square', 0.12, 0.28, 55);
      this.vibrate(35);
    }
  }

  const sound = new SoundEngine();

  // Special Power-up & Trap Drops

    { minCm: 400, name: '神話級クソゲー覇王' }
  ];

  // ==========================================================================
  // 3. Persistent Save State
  // ==========================================================================
  const STORAGE_KEY = 'bakumori_donburi_save_v1';
  const state = {
    kcal: 250,
    bestHeightCm: 0,
    bestChabudaiM: 0,
    totalPops: 0,
    bowlLevel: 1,
    glueLevel: 1,
    powerLevel: 1,
    unlockedIds: ['ebifurai', 'katsu', 'tamago', 'pudding', 'salmon', 'octo', 'onigiri', 'ramen'],

  function loadSave() {

        const parsed = JSON.parse(raw);
        Object.assign(state, parsed);
      }
    } catch (e) {}

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({

  // ==========================================================================
  // 4. Game Engine & Physics State

  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  let W = 380, H = 600;

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(300, Math.floor(rect.width));
    H = Math.max(380, Math.floor(rect.height));
    canvas.width = W;

  // Particles & Floating Texts

  const floatTexts = [];

  function addFloatText(x, y, text, color = '#ffeb3b', size = 18) {
    floatTexts.push({ x, y, text, color, size, life: 1.0, vy: -1.8 });
  }
  function addBurst(x, y, color = '#ffcc00', count = 14) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const spd = 2 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 2,
        r: 4 + Math.random() * 5,
        color,
        life: 1.0
      });

  }

  // ==========================================================================
  // MODE 1: Bakumori Donburi Tower State
  // ==========================================================================
  const tower = {
    bowlX: 190,
    targetBowlX: 190,
    bowlVelX: 0,
    stack: [],       // { item, relX, width, height, yOffset, angle, glued }
    falling: [],     // active falling objects
    spawnTimer: 0,
    craneX: 190,

  };

  function pickRandomIngredient() {
    if (Math.random() < 0.16 && tower.stack.length >= 2) {
      return SPECIAL_ITEMS[Math.floor(Math.random() * SPECIAL_ITEMS.length)];
    }
    const pool = INGREDIENTS.filter(i => state.unlockedIds.includes(i.id));
    return pool[Math.floor(Math.random() * pool.length)] || INGREDIENTS[0];
  }

  function getBowlWidth() {
    return Math.min(W * 0.65, 110 + (state.bowlLevel - 1) * 16);

  function resetTower(cashOut = true) {
    if (cashOut && tower.stack.length > 0) {
      const bonus = Math.floor(tower.heightCm * 2.5);
      if (bonus > 0) {
        state.kcal += bonus;
        addFloatText(W / 2, H / 2, `精算ボーナス +${bonus} kcal!!`, '#69f0ae', 22);
        sound.sfxFever();

    tower.stack = [];

    tower.cameraY = 0;

  function triggerFever() {
    if (tower.feverTimer > 0) return;
    tower.feverTimer = 420; // 7 seconds at 60fps
    tower.feverGauge = 0;
    tower.stack.forEach(s => { s.glued = true; s.relX *= 0.45; });

  function spawnFallingItem(fromCrane = false) {
    const def = fromCrane ? (tower.craneItem || pickRandomIngredient()) : pickRandomIngredient();
    const x = fromCrane ? tower.craneX : (45 + Math.random() * (W - 90));
    const speedMult = tower.feverTimer > 0 ? 1.35 : 1.0;
    tower.falling.push({
      def,
      x,
      y: -30 - tower.cameraY,
      vx: 0,
      vy: (fromCrane ? 4.5 : 2.6 + Math.min(tower.stack.length * 0.12, 3.0)) * speedMult,
      rot: (Math.random() - 0.5) * 0.2
    });

      tower.craneItem = pickRandomIngredient();
      sound.sfxDrop();

  // ==========================================================================
  // MODE 2: Chabudai Flip (ちゃぶ台返し飛距離王) State
  // ==========================================================================
  const REASONS = [
    '「今日から毎日サービス残業ね」と言われた！',
    '楽しみにしていた限定プリンを勝手に食べられた！',
    '完成直前に「やっぱり仕様全部変えて」と言われた！',
    '足の小指をタンスの角に音速でぶつけた！',
    'ガチャ100連回して全部ハズレだった！',
    'カップ焼きそばの湯切りで麺が全部シンクに落ちた！'
  ];

  const chabudai = {
    phase: 'charge', // 'charge' | 'flying' | 'landed'
    reason: REASONS[0],
    gauge: 0,
    gaugeDir: 1,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    rot: 0,
    distanceM: 0,
    boostsLeft: 3
  };

  function resetChabudai() {
    chabudai.phase = 'charge';
    chabudai.reason = REASONS[Math.floor(Math.random() * REASONS.length)];
    chabudai.gauge = 0;
    chabudai.gaugeDir = 1;
    chabudai.x = 0;
    chabudai.y = 0;
    chabudai.vx = 0;
    chabudai.vy = 0;
    chabudai.rot = 0;
    chabudai.distanceM = 0;

  // ==========================================================================
  // MODE 3: Puchipuchi & Stamp Smash State
  // ==========================================================================
  const puchi = {
    bubbles: [],
    docHp: 0,
    docMaxHp: 5,
    docTitle: '',
    stamps: []
  };

  const DOC_TITLES = [
    '【稟議書】休日出勤の恒久化について',
    '【申請書】社長の銅像建設予算(5億円)',
    '【通達】明日から公用語を縄文語とする',
    '【契約書】タピオカ10トン定期購入',
    '【報告書】サーバーを猫が踏んで停止'
  ];

  function initPuchiSheet() {
    puchi.bubbles = [];
    const cols = 5;
    const rows = 6;
    const cellW = (W - 40) / cols;
    const cellH = (H - 180) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const isGold = Math.random() < 0.18;
        puchi.bubbles.push({
          x: 20 + cellW * (c + 0.5),
          y: 115 + cellH * (r + 0.5),
          radius: Math.min(cellW, cellH) * 0.39,
          popped: false,
          isGold
        });
      }
    }
    if (Math.random() < 0.45) {
      puchi.docMaxHp = 5;
      puchi.docHp = 5;
      puchi.docTitle = DOC_TITLES[Math.floor(Math.random() * DOC_TITLES.length)];
      puchi.stamps = [];
    }
  }
  initPuchiSheet();

  // ==========================================================================
  // 5. Input Handling (1-Finger Intuitive Touch & Mouse)
  // ==========================================================================
  let isPointerDown = false;

  function getStageCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: ((clientX - rect.left) / rect.width) * W,
      y: ((clientY - rect.top) / rect.height) * H
    };
  }

  function onPointerDown(e) {
    sound.init();
    isPointerDown = true;
    const pos = getStageCoords(e);

    if (state.mode === 'tower') {
      if (tower.collapsing) {
        resetTower(false);
        return;
      }
      if (state.towerControl === 'drop') {
        tower.craneX = Math.max(40, Math.min(W - 40, pos.x));
        if (tower.falling.length < 3) {
          spawnFallingItem(true);
        }
      } else {
        tower.targetBowlX = Math.max(40, Math.min(W - 40, pos.x));
      }
    } else if (state.mode === 'chabudai') {
      if (chabudai.phase === 'charge') {
        // Launch Chabudai!
        chabudai.phase = 'flying';
        const powerRatio = 0.35 + 0.65 * Math.sin(chabudai.gauge * Math.PI);
        const pwrMult = (1 + (state.powerLevel - 1) * 0.35) * powerRatio;
        chabudai.vx = 18 * pwrMult;
        chabudai.vy = -16 * pwrMult;
        chabudai.y = 10;
        screenShake = 14;
        sound.sfxBomb();
        addBurst(80, H - 90, '#ff5722', 24);
        addFloatText(W / 2, H * 0.4, `うぉぉぉぉぉ！！(${Math.round(powerRatio * 100)}%パワー)`, '#ffeb3b', 22);
      } else if (chabudai.phase === 'flying' && chabudai.boostsLeft > 0) {
        chabudai.boostsLeft--;
        chabudai.vy = -12 - state.powerLevel * 1.8;
        chabudai.vx += 6 + state.powerLevel * 1.4;
        sound.sfxCatch(4);
        screenShake = 8;
        addFloatText(W * 0.45, H * 0.45, '🚀追い醤油ジェット噴射!!', '#ff9800', 18);
        addBurst(W * 0.35, H * 0.55, '#ffd600', 16);
      } else if (chabudai.phase === 'landed') {
        resetChabudai();
      }
    } else if (state.mode === 'puchipuchi') {
      handlePuchiTap(pos.x, pos.y);
    }
  }

  function onPointerMove(e) {
    if (!isPointerDown) return;
    const pos = getStageCoords(e);
    if (state.mode === 'tower') {
      if (state.towerControl === 'catch') {
        tower.targetBowlX = Math.max(40, Math.min(W - 40, pos.x));
      } else {
        tower.craneX = Math.max(40, Math.min(W - 40, pos.x));
      }
    } else if (state.mode === 'puchipuchi') {
      handlePuchiTap(pos.x, pos.y);
    }
  }

  function onPointerUp() {
    isPointerDown = false;
  }

  canvas.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
  window.addEventListener('touchend', onPointerUp);

  function handlePuchiTap(x, y) {
    // If Boss Document is active, stamp it!
    if (puchi.docHp > 0) {
      if (x > 30 && x < W - 30 && y > 100 && y < H - 60) {
        puchi.docHp--;
        puchi.stamps.push({ x, y, rot: (Math.random() - 0.5) * 0.5 });
        sound.sfxStamp();
        screenShake = 6;
        const gain = 25 * state.powerLevel;
        state.kcal += gain;
        addFloatText(x, y, `却下ァ!! +${gain} kcal`, '#ff1744', 20);
        if (puchi.docHp <= 0) {
          const clearBonus = 150 * state.powerLevel;
          state.kcal += clearBonus;
          sound.sfxFever();
          addBurst(W / 2, H / 2, '#ff1744', 26);
          addFloatText(W / 2, H / 2 - 20, `書類粉砕ボーナス +${clearBonus} kcal!!`, '#ffff00', 22);
        }
        saveState();
        return;
      }
    }

    for (const b of puchi.bubbles) {
      if (!b.popped) {
        const dx = x - b.x;
        const dy = y - b.y;
        if (dx * dx + dy * dy <= (b.radius + 10) * (b.radius + 10)) {
          b.popped = true;
          state.totalPops++;
          const gain = (b.isGold ? 40 : 10) * state.bowlLevel;
          state.kcal += gain;
          sound.sfxPop();
          addBurst(b.x, b.y, b.isGold ? '#ffd600' : '#4fc3f7', 8);
          addFloatText(b.x, b.y - 10, `+${gain}`, b.isGold ? '#ffd600' : '#fff', 15);
        }
      }
    }

    if (puchi.bubbles.every(b => b.popped)) {
      const sheetBonus = 120 * state.bowlLevel;
      state.kcal += sheetBonus;
      sound.sfxFever();
      addFloatText(W / 2, H / 2, `🎉全プチ制覇ボーナス +${sheetBonus} kcal!`, '#ffd600', 20);
      initPuchiSheet();
    }
    saveState();
  }

  // ==========================================================================
  // 6. Main Simulation & Render Loop
  // ==========================================================================
  function updateTower() {
    const bowlBaseY = H - 62;
    const prevX = tower.bowlX;
    tower.bowlX += (tower.targetBowlX - tower.bowlX) * 0.28;
    tower.bowlVelX = tower.bowlX - prevX;

    if (tower.feverTimer > 0) {
      tower.feverTimer--;
    }

    // Crane movement in drop mode
    if (state.towerControl === 'drop' && !isPointerDown) {
      tower.craneX += tower.craneDir * 2.5;
      if (tower.craneX > W - 50) tower.craneDir = -1;
      if (tower.craneX < 50) tower.craneDir = 1;
    }

    // Auto-spawn in catch mode
    if (state.towerControl === 'catch' && !tower.collapsing) {
      tower.spawnTimer++;
      const interval = tower.feverTimer > 0 ? 28 : Math.max(38, 68 - tower.stack.length * 1.1);
      if (tower.spawnTimer >= interval) {
        tower.spawnTimer = 0;
        spawnFallingItem(false);
      }
    }

    // Calculate stack positions and center of mass
    const bowlW = getBowlWidth();
    let curY = 0;
    let weightedTorque = 0;
    for (let i = 0; i < tower.stack.length; i++) {
      const s = tower.stack[i];
      s.yOffset = curY + s.height * 0.5;
      curY += s.height * 0.84;

      if (!s.glued && !tower.collapsing) {
        // Inertia from moving the bowl + tilt slide
        const glueResistance = 1 + (state.glueLevel - 1) * 0.35;
        s.relX -= (tower.bowlVelX * 0.06 * (1 + i * 0.06)) / glueResistance;
        s.relX += (tower.tiltAngle * 0.45) / glueResistance;
      }
      weightedTorque += (s.relX / (bowlW * 0.5)) * (s.item.mass || 1.0) * (1 + i * 0.08);
    }

    tower.heightCm = Math.round(curY * 0.45 * 10) / 10;
    if (tower.heightCm > state.bestHeightCm) {
      state.bestHeightCm = tower.heightCm;
    }

    // Camera smoothly follows tall stacks
    const targetCamY = Math.max(0, curY - (H * 0.48));
    tower.cameraY += (targetCamY - tower.cameraY) * 0.12;

    // Physics tilt & collapse check
    if (!tower.collapsing) {
      const stiffness = 0.045 * (1 + (state.glueLevel - 1) * 0.25);
      tower.tiltVel += (weightedTorque * 0.0038) - tower.tiltAngle * stiffness;
      tower.tiltVel *= 0.88;
      tower.tiltAngle += tower.tiltVel;

      // Check if top item slid completely off or angle exceeded threshold
      const topItem = tower.stack[tower.stack.length - 1];
      const maxRelX = bowlW * 0.82;
      if (Math.abs(tower.tiltAngle) > 0.62 || (topItem && Math.abs(topItem.relX) > maxRelX)) {
        tower.collapsing = true;
        tower.collapseTimer = 95;
        screenShake = 18;
        sound.sfxCollapse();
        addFloatText(W / 2, H * 0.38, '😱 ガシャーーーン！！崩壊！！', '#ff5252', 22);
        // Scatter items
        tower.stack.forEach((s, idx) => {
          s.vx = (Math.random() - 0.5) * 8 + tower.tiltAngle * 10;
          s.vy = -3 - Math.random() * 6;
          s.absX = tower.bowlX + s.relX;
          s.absY = bowlBaseY - s.yOffset;
        });
        saveState();
      }
    } else {
      tower.collapseTimer--;
      tower.stack.forEach(s => {
        s.absX += s.vx;
        s.absY += s.vy;
        s.vy += 0.45;
        s.angle += 0.12;
      });
      if (tower.collapseTimer <= 0) {
        resetTower(false);
      }
    }

    // Update falling items & landing detection
    const topSurfaceY = bowlBaseY - curY;
    const topCenterX = tower.stack.length > 0
      ? tower.bowlX + tower.stack[tower.stack.length - 1].relX + Math.sin(tower.tiltAngle) * curY * 0.4
      : tower.bowlX;
    const catchHalfW = tower.stack.length > 0
      ? Math.max(42, tower.stack[tower.stack.length - 1].width * 0.68 + bowlW * 0.22)
      : bowlW * 0.62;

    for (let i = tower.falling.length - 1; i >= 0; i--) {
      const f = tower.falling[i];
      f.y += f.vy;
      f.x += f.vx;

      if (!tower.collapsing && f.y + f.def.h * 0.5 >= topSurfaceY && f.y - f.def.h * 0.5 <= topSurfaceY + 34) {
        const dx = f.x - topCenterX;
        if (Math.abs(dx) <= catchHalfW) {
          // Landed!
          tower.falling.splice(i, 1);
          handleItemLanded(f.def, dx, f.x, topSurfaceY - tower.cameraY);
          continue;
        }
      }

      if (f.y > bowlBaseY + 90) {
        tower.falling.splice(i, 1);
        if (!f.def.special) {
          tower.combo = 0;
        }
      }
    }
  }

  function handleItemLanded(def, dx, screenX, screenY) {
    if (def.special === 'bomb') {
      sound.sfxBomb();
      screenShake = 14;
      addBurst(screenX, Math.max(80, screenY), '#ff1744', 22);
      if (tower.stack.length > 0) {
        const removed = tower.stack.splice(Math.max(0, tower.stack.length - 2));
        addFloatText(screenX, Math.max(80, screenY), `💣爆発！${removed.length}個吹き飛んだ！`, '#ff5252', 18);
      } else {
        addFloatText(screenX, Math.max(80, screenY), '💣セーフ！空振り！', '#fff', 16);
      }
      return;
    }

    if (def.special === 'glue') {
      triggerFever();
      return;
    }

    if (def.special === 'straighten') {
      tower.stack.forEach(s => { s.relX *= 0.15; s.glued = true; });
      tower.tiltAngle = 0;
      tower.tiltVel = 0;
      sound.sfxFever();
      addFloatText(screenX, Math.max(80, screenY), '🥢神業割り箸！完全真っ直ぐ矯正！', '#69f0ae', 19);
      return;
    }

    // Normal ingredient landed!
    tower.combo++;
    const parentRelX = tower.stack.length > 0 ? tower.stack[tower.stack.length - 1].relX : 0;
    const isJust = Math.abs(dx) < 12;
    const dampedDx = isJust ? 0 : dx * 0.62;

    tower.stack.push({
      item: def,
      relX: parentRelX + dampedDx,
      width: def.w,
      height: def.h,
      yOffset: 0,
      angle: (Math.random() - 0.5) * 0.06,
      glued: tower.feverTimer > 0
    });

    const mult = (tower.feverTimer > 0 ? 3 : 1) * (isJust ? 2 : 1);
    const earned = Math.round(def.kcal * mult * (1 + tower.combo * 0.1));
    state.kcal += earned;

    if (!state.unlockedIds.includes(def.id)) {
      state.unlockedIds.push(def.id);
    }

    tower.feverGauge = Math.min(100, tower.feverGauge + (isJust ? 28 : 18));
    if (tower.feverGauge >= 100 && tower.feverTimer <= 0) {
      document.getElementById('fever-btn').style.display = 'block';
    }

    sound.sfxCatch(tower.combo);
    addBurst(screenX, Math.max(60, screenY), def.color || '#ffcc00', isJust ? 16 : 9);
    const label = isJust ? `🎯ど真ん中!! +${earned}kcal` : `+${earned}kcal (${tower.combo}連)`;
    addFloatText(screenX, Math.max(60, screenY), label, isJust ? '#00e676' : '#ffeb3b', isJust ? 19 : 15);
    saveState();
  }

  function drawTower() {
    // Japanese Diner Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (tower.feverTimer > 0) {
      grad.addColorStop(0, '#ff6f00');
      grad.addColorStop(1, '#fff59d');
    } else if (tower.heightCm > 120) {
      grad.addColorStop(0, '#0d1b2a');
      grad.addColorStop(1, '#415a77');
    } else {
      grad.addColorStop(0, '#ffe0b2');
      grad.addColorStop(1, '#fff8e1');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Height Ruler Marks in Background
    ctx.save();
    ctx.strokeStyle = 'rgba(120, 60, 20, 0.18)';
    ctx.fillStyle = 'rgba(120, 60, 20, 0.45)';
    ctx.font = 'bold 11px sans-serif';
    const bowlBaseY = H - 62;
    for (let cm = 10; cm <= 500; cm += 10) {
      const pxY = bowlBaseY - (cm / 0.45) + tower.cameraY;
      if (pxY > 30 && pxY < H - 40) {
        ctx.beginPath();
        ctx.moveTo(0, pxY);
        ctx.lineTo(W, pxY);
        ctx.stroke();
        ctx.fillText(`${cm}cm`, 8, pxY - 4);
      }
    }
    ctx.restore();

    // Draw Crane if in 'drop' mode
    if (state.towerControl === 'drop' && !tower.collapsing && tower.craneItem) {
      ctx.save();
      ctx.strokeStyle = '#5d4037';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(tower.craneX, 0);
      ctx.lineTo(tower.craneX, 68);
      ctx.stroke();
      drawIngredientSprite(tower.craneItem, tower.craneX, 82, 0, false);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('👇タップでここに落とす', tower.craneX, 118);
      ctx.restore();
    }

    // Counter Table
    ctx.fillStyle = '#8d4925';
    ctx.fillRect(0, bowlBaseY + 22 + tower.cameraY, W, H);
    ctx.fillStyle = '#5d2c12';
    ctx.fillRect(0, bowlBaseY + 22 + tower.cameraY, W, 6);

    // Draw Bowl & Rice
    const bowlW = getBowlWidth();
    const by = bowlBaseY + tower.cameraY;
    ctx.save();
    ctx.translate(tower.bowlX, by);

    // White Rice Mound
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#d7ccc8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -4, bowlW * 0.48, 22, 0, Math.PI, 0);
    ctx.fill();
    ctx.stroke();

    // Bowl Body
    ctx.fillStyle = state.bowlLevel >= 4 ? '#ffd600' : '#c62828';
    ctx.strokeStyle = '#212121';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-bowlW * 0.52, -4);
    ctx.quadraticCurveTo(-bowlW * 0.46, 26, -bowlW * 0.22, 26);
    ctx.lineTo(bowlW * 0.22, 26);
    ctx.quadraticCurveTo(bowlW * 0.46, 26, bowlW * 0.52, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Gold Rim
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-bowlW * 0.49, 2);
    ctx.lineTo(bowlW * 0.49, 2);
    ctx.stroke();
    ctx.restore();

    // Draw Stacked Ingredients
    for (let i = 0; i < tower.stack.length; i++) {
      const s = tower.stack[i];
      if (tower.collapsing) {
        drawIngredientSprite(s.item, s.absX, s.absY + tower.cameraY, s.angle, s.glued);
      } else {
        const swayX = Math.sin(tower.tiltAngle) * (s.yOffset * 0.45);
        const ix = tower.bowlX + s.relX + swayX;
        const iy = bowlBaseY - s.yOffset + tower.cameraY;
        drawIngredientSprite(s.item, ix, iy, s.angle + tower.tiltAngle * 0.65, s.glued);
      }
    }

    // Draw Falling Ingredients
    for (const f of tower.falling) {
      drawIngredientSprite(f.def, f.x, f.y + tower.cameraY, f.rot, false);
    }

    // Balance & Fever Gauge Indicator at Bottom
    const barW = 160;
    const barX = (W - barW) / 2;
    const barY = H - 22;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(barX, barY, barW, 12);
    const ratio = Math.max(-1, Math.min(1, tower.tiltAngle / 0.62));
    ctx.fillStyle = Math.abs(ratio) > 0.7 ? '#ff1744' : '#00e676';
    ctx.fillRect(barX + barW / 2 + ratio * (barW / 2) - 5, barY - 2, 10, 16);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(barX, barY, barW, 12);
  }

  function drawIngredientSprite(def, x, y, angle, glued) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const w = def.w || 64;
    const h = def.h || 32;

    // Plate / Cushion Capsule
    ctx.fillStyle = glued ? '#ffd600' : (def.color || '#ffb74d');
    ctx.strokeStyle = glued ? '#fff' : '#3e2723';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, 10);
    ctx.fill();
    ctx.stroke();

    // Emoji + Name Label
    ctx.font = `${Math.floor(h * 0.78)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.emoji, -w * 0.24, 1);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 11px sans-serif';
    ctx.strokeText(def.name.slice(0, 6), w * 0.12, 1);
    ctx.fillText(def.name.slice(0, 6), w * 0.12, 1);

    ctx.restore();
  }

  // ==========================================================================
  // 7. Chabudai Mode Update & Render
  // ==========================================================================
  function updateChabudai() {
    if (chabudai.phase === 'charge') {
      chabudai.gauge += chabudai.gaugeDir * 0.032;
      if (chabudai.gauge >= 1) { chabudai.gauge = 1; chabudai.gaugeDir = -1; }
      if (chabudai.gauge <= 0) { chabudai.gauge = 0; chabudai.gaugeDir = 1; }
    } else if (chabudai.phase === 'flying') {
      chabudai.x += chabudai.vx;
      chabudai.y -= chabudai.vy;
      chabudai.vy += 0.42; // gravity
      chabudai.rot += 0.25;

      if (chabudai.y <= 0) {
        chabudai.y = 0;
        if (Math.abs(chabudai.vy) > 3.2) {
          chabudai.vy = -chabudai.vy * 0.62;
          chabudai.vx *= 0.78;
          sound.sfxCatch(2);
          screenShake = 5;
        } else {
          chabudai.vx *= 0.88;
          if (chabudai.vx < 0.4) {
            chabudai.phase = 'landed';
            chabudai.distanceM = Math.round(chabudai.x * 0.25 * 10) / 10;
            if (chabudai.distanceM > state.bestChabudaiM) {
              state.bestChabudaiM = chabudai.distanceM;
            }
            const reward = Math.max(30, Math.floor(chabudai.distanceM * 1.8));
            state.kcal += reward;
            sound.sfxFever();
            addFloatText(W / 2, H * 0.42, `🎉 記録 ${chabudai.distanceM}m！ +${reward} kcal獲得！`, '#ffff00', 20);
            saveState();
          }
        }
      }
      chabudai.distanceM = Math.round(chabudai.x * 0.25 * 10) / 10;
    }
  }

  function drawChabudai() {
    const isSpace = chabudai.y > 400 || chabudai.distanceM > 300;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (isSpace) {
      grad.addColorStop(0, '#050517');
      grad.addColorStop(1, '#1f1147');
    } else {
      grad.addColorStop(0, '#ff7043');
      grad.addColorStop(1, '#ffe082');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const groundY = H - 75;
    // Tatami Floor
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#33691e';
    ctx.fillRect(0, groundY, W, 6);

    // Reason Banner
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(14, 65, W - 28, 44);
    ctx.strokeStyle = '#ffeb3b';
    ctx.strokeRect(14, 65, W - 28, 44);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💢本日のブチ切れ案件:', W / 2, 83);
    ctx.fillStyle = '#ffeb3b';
    ctx.fillText(chabudai.reason, W / 2, 101);

    if (chabudai.phase === 'charge') {
      // Draw Person & Chabudai Ready
      ctx.font = '56px sans-serif';
      ctx.fillText('😤', 75, groundY - 12);
      ctx.fillText('🪵🍵🐟', 155, groundY - 8);

      // Power Gauge
      const gw = W - 60;
      const gx = 30;
      const gy = H * 0.48;
      ctx.fillStyle = '#212121';
      ctx.fillRect(gx, gy, gw, 26);
      const pwr = Math.sin(chabudai.gauge * Math.PI);
      ctx.fillStyle = pwr > 0.85 ? '#ff1744' : '#ffeb3b';
      ctx.fillRect(gx + 3, gy + 3, (gw - 6) * pwr, 20);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(gx, gy, gw, 26);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('👆 画面タップでちゃぶ台をひっくり返せ！！', W / 2, gy - 14);
    } else {
      // Draw Flying Chabudai
      ctx.save();
      const drawY = Math.max(90, groundY - 30 - Math.min(240, chabudai.y * 0.45));
      ctx.translate(W * 0.5, drawY);
      ctx.rotate(chabudai.rot);
      ctx.font = '52px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🪵🍵🐟', 0, 0);
      ctx.restore();

      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeText(`飛距離: ${chabudai.distanceM} m`, W / 2, H * 0.32);
      ctx.fillText(`飛距離: ${chabudai.distanceM} m`, W / 2, H * 0.32);

      if (chabudai.phase === 'flying') {
        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = '#ffeb3b';
        ctx.fillText(`🚀 空中タップで追い醤油噴射 (残り ${chabudai.boostsLeft} 回)`, W / 2, H * 0.39);
      } else {
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = '#69f0ae';
        ctx.fillText('👆 タップでもう一回ちゃぶ台を返す！', W / 2, H * 0.52);
      }
    }
  }

  // ==========================================================================
  // 8. Puchipuchi & Stamp Smash Mode Render
  // ==========================================================================
  function drawPuchipuchi() {
    ctx.fillStyle = '#263238';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👇 指でなぞって無限プチプチ！理不尽な書類が出たら連打で却下！', W / 2, 84);

    for (const b of puchi.bubbles) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
      if (b.popped) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      } else if (b.isGold) {
        ctx.fillStyle = '#ffd600';
        ctx.strokeStyle = '#fff';
      } else {
        ctx.fillStyle = '#81d4fa';
        ctx.strokeStyle = '#e1f5fe';
      }
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();

      if (!b.popped) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath();
        ctx.arc(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Draw Boss Document if active
    if (puchi.docHp > 0) {
      ctx.save();
      ctx.fillStyle = '#fffde7';
      ctx.strokeStyle = '#d32f2f';
      ctx.lineWidth = 4;
      ctx.fillRect(36, 110, W - 72, H - 190);
      ctx.strokeRect(36, 110, W - 72, H - 190);

      ctx.fillStyle = '#b71c1c';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🚨 緊急稟議書が出現！！連打で却下せよ！！', W / 2, 145);

      ctx.fillStyle = '#212121';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(puchi.docTitle, W / 2, 185);

      ctx.fillStyle = '#d32f2f';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(`残り耐久力: ${'❤️'.repeat(puchi.docHp)}`, W / 2, 225);

      for (const st of puchi.stamps) {
        ctx.save();
        ctx.translate(st.x, st.y);
        ctx.rotate(st.rot);
        ctx.strokeStyle = 'rgba(213, 0, 0, 0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(213, 0, 0, 0.85)';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('却下', 0, 5);
        ctx.restore();
      }
      ctx.restore();
    }
  }

  // ==========================================================================
  // 9. Master Animation Frame
  // ==========================================================================
  let isModalPaused = false;
  function tick() {
    if (isModalPaused) {
      requestAnimationFrame(tick);
      return;
    }
    ctx.save();
    if (screenShake > 0) {
      const sx = (Math.random() - 0.5) * screenShake;
      const sy = (Math.random() - 0.5) * screenShake;
      ctx.translate(sx, sy);
      screenShake *= 0.82;
      if (screenShake < 0.5) screenShake = 0;
    }

    if (state.mode === 'tower') {
      updateTower();
      drawTower();
    } else if (state.mode === 'chabudai') {
      updateChabudai();
      drawChabudai();
    } else {
      drawPuchipuchi();
    }

    // Update & Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.life -= 0.03;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Update & Draw Floating Texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y += ft.vy;
      ft.life -= 0.022;
      if (ft.life <= 0) {
        floatTexts.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.min(1, ft.life * 1.4);
      ctx.font = `900 ${ft.size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();
    updateHUD();
    requestAnimationFrame(tick);
  }

  // ==========================================================================
  // 10. UI Wiring & Upgrades
  // ==========================================================================
  function getCurrentTitle() {
    let cur = TITLES[0].name;
    for (const t of TITLES) {
      if (state.bestHeightCm >= t.minCm) cur = t.name;
    }
    return cur;
  }

  function getBowlCost() { return Math.floor(100 * Math.pow(1.65, state.bowlLevel - 1)); }
  function getGlueCost() { return Math.floor(120 * Math.pow(1.65, state.glueLevel - 1)); }
  function getPowerCost() { return Math.floor(150 * Math.pow(1.65, state.powerLevel - 1)); }

  function updateHUD() {
    document.getElementById('kcal-display').textContent = Math.floor(state.kcal).toLocaleString();
    if (state.mode === 'tower') {
      document.getElementById('score-val').textContent = tower.heightCm.toFixed(1);
      document.getElementById('stack-val').textContent = tower.stack.length;
      document.getElementById('best-val').textContent = state.bestHeightCm.toFixed(1);
    } else if (state.mode === 'chabudai') {
      document.getElementById('score-val').textContent = chabudai.distanceM.toFixed(1);
      document.getElementById('stack-val').textContent = chabudai.boostsLeft;
      document.getElementById('best-val').textContent = state.bestChabudaiM.toFixed(1);
    } else {
      document.getElementById('score-val').textContent = state.totalPops;
      document.getElementById('stack-val').textContent = puchi.bubbles.filter(b => !b.popped).length;
      document.getElementById('best-val').textContent = state.bestHeightCm.toFixed(1);
    }
  }

  function updateUI() {
    document.getElementById('title-badge').textContent = `称号: ${getCurrentTitle()}`;
    document.getElementById('lvl-bowl').textContent = `Lv.${state.bowlLevel}`;
    document.getElementById('cost-bowl').textContent = `${getBowlCost()} kcal`;
    document.getElementById('lvl-glue').textContent = `Lv.${state.glueLevel}`;
    document.getElementById('cost-glue').textContent = `${getGlueCost()} kcal`;
    document.getElementById('lvl-power').textContent = `Lv.${state.powerLevel}`;
    document.getElementById('cost-power').textContent = `${getPowerCost()} kcal`;

    document.getElementById('upg-bowl').classList.toggle('disabled', state.kcal < getBowlCost());
    document.getElementById('upg-glue').classList.toggle('disabled', state.kcal < getGlueCost());
    document.getElementById('upg-power').classList.toggle('disabled', state.kcal < getPowerCost());

    const subBtn = document.getElementById('substyle-btn');
    subBtn.style.display = state.mode === 'tower' ? 'block' : 'none';
    subBtn.textContent = state.towerControl === 'catch' ? '🎯 操作: キャッチ式' : '🏗️ 操作: クレーン落し';
  }

  // Mode Tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.mode = tab.dataset.mode;
      sound.sfxPop();
      updateUI();
    });
  });

  // Toggle Tower Control Style
  document.getElementById('substyle-btn').addEventListener('click', () => {
    state.towerControl = state.towerControl === 'catch' ? 'drop' : 'catch';
    tower.falling = [];
    tower.craneItem = pickRandomIngredient();
    sound.sfxPop();
    saveState();
  });

  document.getElementById('fever-btn').addEventListener('click', () => {
    triggerFever();
  });

  // Upgrade Buttons
  document.getElementById('upg-bowl').addEventListener('click', () => {
    const cost = getBowlCost();
    if (state.kcal >= cost) {
      state.kcal -= cost;
      state.bowlLevel++;
      sound.sfxFever();
      addFloatText(W * 0.2, H - 90, `🍚器サイズ Lv.${state.bowlLevel}!!`, '#ffd600', 18);
      saveState();
    }
  });

  document.getElementById('upg-glue').addEventListener('click', () => {
    const cost = getGlueCost();
    if (state.kcal >= cost) {
      state.kcal -= cost;
      state.glueLevel++;
      sound.sfxFever();
      addFloatText(W * 0.45, H - 90, `🍯タレ粘着力 Lv.${state.glueLevel}!!`, '#ffd600', 18);
      saveState();
    }
  });

  document.getElementById('upg-power').addEventListener('click', () => {
    const cost = getPowerCost();
    if (state.kcal >= cost) {
      state.kcal -= cost;
      state.powerLevel++;
      sound.sfxFever();
      addFloatText(W * 0.7, H - 90, `💪筋力 Lv.${state.powerLevel}!!`, '#ffd600', 18);
      saveState();
    }
  });

  document.getElementById('upg-reset').addEventListener('click', () => {
    if (state.mode === 'tower') resetTower(true);
    else if (state.mode === 'chabudai') resetChabudai();
    else initPuchiSheet();
  });

  // Sound Button
  document.getElementById('btn-sound').addEventListener('click', () => {
    sound.enabled = !sound.enabled;
    document.getElementById('btn-sound').textContent = sound.enabled ? '🔊音ON' : '🔇音OFF';
  });

  // Encyclopedia & Gacha Modal
  function renderDexModal() {
    document.getElementById('dex-count').textContent = state.unlockedIds.length;
    document.getElementById('modal-title-name').textContent = getCurrentTitle();
    const grid = document.getElementById('dex-grid');
    grid.innerHTML = '';
    for (const ing of INGREDIENTS) {
      const unlocked = state.unlockedIds.includes(ing.id);
      const div = document.createElement('div');
      div.className = 'dex-item' + (unlocked ? '' : ' locked');
      div.innerHTML = `
        <span class="dex-emoji">${unlocked ? ing.emoji : '❓'}</span>
        <div style="font-weight:900;">${unlocked ? ing.name : '？？？'}</div>
        <div style="font-size:10px;color:#d84315;">${unlocked ? ing.kcal + ' kcal' : '未発見'}</div>
      `;
      grid.appendChild(div);
    }
  }

  document.getElementById('btn-dex').addEventListener('click', () => {
    isModalPaused = true;
    isPointerDown = false;
    renderDexModal();
    document.getElementById('dex-modal').classList.add('show');
  });
  document.getElementById('close-dex').addEventListener('click', () => {
    isModalPaused = false;
    document.getElementById('dex-modal').classList.remove('show');
  });
  document.getElementById('dex-modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('dex-modal')) {
      isModalPaused = false;
      document.getElementById('dex-modal').classList.remove('show');
    }
  });

  document.getElementById('btn-gacha').addEventListener('click', () => {
    const locked = INGREDIENTS.filter(i => !state.unlockedIds.includes(i.id));
    const gachaBtn = document.getElementById('btn-gacha');
    if (locked.length === 0) {
      gachaBtn.textContent = '✨ 全24種類コンプリート済み！神！！';
      return;
    }
    if (state.kcal < 300) {
      const origText = gachaBtn.textContent;
      gachaBtn.textContent = '⚠️ カロリー不足！(300 kcal必要)';
      setTimeout(() => { gachaBtn.textContent = origText; }, 1800);
      return;
    }
    state.kcal -= 300;
    const won = locked[Math.floor(Math.random() * locked.length)];
    state.unlockedIds.push(won.id);
    sound.sfxFever();
    saveState();
    renderDexModal();
    gachaBtn.textContent = `🎉 獲得: ${won.emoji} ${won.name} (+${won.kcal}kcal)！もう1回回す (300 kcal)`;
  });

  resetTower(false);
  updateUI();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
