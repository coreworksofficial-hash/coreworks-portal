    { badge: '⚡ 倍率100倍フィーバー突入！', text: '黄金ラッシュを発動したら秒間収益がバグったwww' },
    { badge: '💡 暮らしの損得 × 物理ゲーム', text: '現実でも秒速で元が取れる「神アイテム」に投資しまくった結果！' }
  ];

  // ============================================================================
  // 2. GAME STATE & PERSISTENCE
  // ============================================================================
  const SAVE_KEY = 'cw_money_drop_v1';
  let state = {
    money: 0,
    totalEarned: 0,
    maxTierUnlocked: 0,
    fever: 0,
    feverActiveUntil: 0,
    upgrades: {
      spawnRate: 1,   // Auto spawn interval reduction
      startTier: 0,   // Initial coin tier (0 = 1yen, 1 = 10yen, etc.)
      bumperMult: 1,  // Bumper payout multiplier
      gateBoost: 1,   // Bottom collector gate multiplier
      pinCount: 1     // Extra multiplier bumpers on stage
    },
    realItems: {
      bottle: 0,
      blanket: 0,
      shower: 0,
      coffee: 0,
      dishwasher: 0
    },
    lastSaved: Date.now()
  };

  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = Object.assign({}, state, parsed);
        state.upgrades = Object.assign({ spawnRate: 1, startTier: 0, bumperMult: 1, gateBoost: 1, pinCount: 1 }, parsed.upgrades || {});
        state.realItems = Object.assign({ bottle: 0, blanket: 0, shower: 0, coffee: 0, dishwasher: 0 }, parsed.realItems || {});
      }
    } catch (e) {}
  }

  function saveState() {
    try {
      state.lastSaved = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  loadState();

  // ============================================================================
  // 3. WEB AUDIO SYNTHESIZER (ASMR Coin Clinks, Chords & MediaStream Output)
  // ============================================================================
  let audioCtx = null;
  let audioDest = null; // For MediaRecorder audio capture
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      if (audioCtx.createMediaStreamDestination) {
        audioDest = audioCtx.createMediaStreamDestination();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function connectOut(node) {
    node.connect(audioCtx.destination);
    if (audioDest) node.connect(audioDest);
  }

  function playBumperSound(tierId = 0, mult = 2) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const baseFreq = TIERS[Math.min(tierId, TIERS.length - 1)].pitch;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq * (1 + (mult - 1) * 0.08), now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.09);

    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

    osc.connect(gain);
    connectOut(gain);
    osc.start(now);
    osc.stop(now + 0.11);
  }

  function playMergeSound(newTierId) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const baseFreq = TIERS[Math.min(newTierId, TIERS.length - 1)].pitch;
    [1, 1.25, 1.5].forEach((ratio, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(baseFreq * ratio, now + idx * 0.035);
      gain.gain.setValueAtTime(0.15, now + idx * 0.035);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.035 + 0.22);
      osc.connect(gain);
      connectOut(gain);
      osc.start(now + idx * 0.035);
      osc.stop(now + idx * 0.035 + 0.23);
    });
  }

  function playGateSound() {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(1318.5, now + 0.05);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    connectOut(gain);
    osc.start(now);
    osc.stop(now + 0.17);
  }

  // ============================================================================
  // 4. NUMBER FORMATTING & ECONOMY CALCULATIONS
  // ============================================================================
  function fmtYen(n) {
    n = Math.floor(n);
    if (n < 10000) return '¥' + n.toLocaleString('ja-JP');
    if (n < 100000000) {
      const man = (n / 10000).toFixed(n >= 1000000 ? 1 : 2).replace(/\.0+$/, '');
      return '¥' + man + '万';
    }
    if (n < 1000000000000) {
      const oku = (n / 100000000).toFixed(2).replace(/\.0+$/, '');
      return '¥' + oku + '億';
    }
    const cho = (n / 1000000000000).toFixed(2).replace(/\.0+$/, '');
    return '¥' + cho + '兆';
  }

  function getGlobalMultiplier() {
    let mult = 1 + (state.upgrades.bumperMult - 1) * 0.45;
    REAL_ITEMS.forEach(item => {
      const lv = state.realItems[item.id] || 0;
      mult += lv * item.multBoost;
    });
    if (Date.now() < state.feverActiveUntil) {
      mult *= 2.5;
    }
    return mult;
  }

  function getPassivePPS() {
    let pps = 0;
    REAL_ITEMS.forEach(item => {
      const lv = state.realItems[item.id] || 0;
      pps += lv * item.ppsBoost;
    });
    return Math.floor(pps * getGlobalMultiplier());
  }

  let recentActiveIncome = [];
  function recordIncome(amount) {
    state.money += amount;
    state.totalEarned += amount;
    recentActiveIncome.push({ t: performance.now(), v: amount });
  }

  function getTotalDisplayPPS() {
    const now = performance.now();
    recentActiveIncome = recentActiveIncome.filter(e => now - e.t < 3000);
    const activeSum = recentActiveIncome.reduce((acc, cur) => acc + cur.v, 0) / 3;
    return Math.floor(getPassivePPS() + activeSum);
  }

  // ============================================================================
  // 5. PHYSICS ENGINE (Coins, Multiplier Bumpers, Spinners, Collector Gates)
  // ============================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 400, H = 480;

  let balls = [];
  let bumpers = [];
  let spinners = [];
  let popups = [];
  let particles = [];
  let shockwaves = [];

  function setupStageGeometry() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(300, Math.floor(rect.width));
    H = Math.max(250, Math.floor(rect.height));
    // High-DPI crisp canvas (fixed internal resolution scaled for smooth 60fps & Shorts recording)
    canvas.width = W * 2;
    canvas.height = H * 2;
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    rebuildBumpers();
  }

  function rebuildBumpers() {
    bumpers = [];
    spinners = [];
    const lv = state.upgrades.pinCount || 1;

    // Row 1 (Upper multiplier bumpers)
    bumpers.push({ x: W * 0.28, y: H * 0.28, r: 22, mult: 2, label: '×2', color: '#38bdf8', pulse: 0 });
    bumpers.push({ x: W * 0.72, y: H * 0.28, r: 22, mult: 2, label: '×2', color: '#38bdf8', pulse: 0 });

    // Center High-Value Mega Bumper
    const centerMult = 3 + Math.floor(lv / 2);
    bumpers.push({ x: W * 0.50, y: H * 0.43, r: 27, mult: centerMult, label: '×' + centerMult, color: '#fbbf24', pulse: 0 });

    // Row 2 (Mid-lower bumpers)
    bumpers.push({ x: W * 0.20, y: H * 0.58, r: 20, mult: 2, label: '×2', color: '#a78bfa', pulse: 0 });
    bumpers.push({ x: W * 0.80, y: H * 0.58, r: 20, mult: 2, label: '×2', color: '#a78bfa', pulse: 0 });

    if (lv >= 2) {
      bumpers.push({ x: W * 0.36, y: H * 0.68, r: 21, mult: 3, label: '×3', color: '#34d399', pulse: 0 });
      bumpers.push({ x: W * 0.64, y: H * 0.68, r: 21, mult: 3, label: '×3', color: '#34d399', pulse: 0 });
    }
    if (lv >= 3) {
      bumpers.push({ x: W * 0.50, y: H * 0.20, r: 17, mult: 4, label: '×4', color: '#f472b6', pulse: 0 });
    }
    if (lv >= 4) {
      bumpers.push({ x: W * 0.14, y: H * 0.39, r: 16, mult: 3, label: '×3', color: '#fb923c', pulse: 0 });
      bumpers.push({ x: W * 0.86, y: H * 0.39, r: 16, mult: 3, label: '×3', color: '#fb923c', pulse: 0 });
    }

    // Rotating pinwheel spinners
    spinners.push({ x: W * 0.35, y: H * 0.49, len: 28, angle: 0, speed: 0.045 });
    spinners.push({ x: W * 0.65, y: H * 0.49, len: 28, angle: 1.2, speed: -0.045 });
  }

  function spawnBall(customX, customTier) {
    if (balls.length > 55) return; // Cap for smooth performance
    const baseTier = customTier !== undefined ? customTier : Math.min(state.upgrades.startTier, TIERS.length - 2);
    // Small chance to spawn +1 tier higher!
    const tierId = (customTier === undefined && Math.random() < 0.18) ? Math.min(baseTier + 1, TIERS.length - 1) : baseTier;
    const t = TIERS[tierId];
    if (tierId > state.maxTierUnlocked) {
      state.maxTierUnlocked = tierId;
      renderEvoBar();
    }
    const x = customX !== undefined ? Math.max(t.r + 10, Math.min(W - t.r - 10, customX)) : (W * 0.22 + Math.random() * (W * 0.56));
    balls.push({
      x,
      y: 26,
      vx: (Math.random() - 0.5) * 3.2,
      vy: 1.2 + Math.random() * 1.5,
      tier: tierId,
      r: t.r,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.1,
      bounces: 0,
      mergeCooldown: 8
    });
  }

  function addPopup(x, y, text, color = '#fbbf24', scale = 1) {
    if (popups.length > 35) popups.shift();
    popups.push({ x, y, text, color, alpha: 1, vy: -1.4, scale });
  }

  function addParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      if (particles.length > 90) particles.shift();
      const ang = Math.random() * Math.PI * 2;
      const spd = 1.5 + Math.random() * 4.5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1,
        r: 2 + Math.random() * 3.5,
        color,
        alpha: 1
      });
    }
  }

  function addFever(amount) {
    if (Date.now() < state.feverActiveUntil) return;
    state.fever = Math.min(100, state.fever + amount);
    if (state.fever >= 100) {
      state.fever = 0;
      state.feverActiveUntil = Date.now() + 8000;
      addPopup(W / 2, H * 0.35, '🔥 黄金FEVER突入！全配当2.5倍！', '#fde047', 1.35);
      // Drop a shower of bonus coins
      for (let i = 0; i < 8; i++) {
        setTimeout(() => spawnBall(W * (0.15 + 0.7 * (i / 7))), i * 90);
      }
    }
  }

  // Collector Gates at the bottom
  const GATES = [
    { ratio: 0.2, mult: 1, label: '×1 回収', color: '#475569' },
    { ratio: 0.2, mult: 2, label: '×2 ボーナス', color: '#0284c7' },
    { ratio: 0.2, mult: 5, label: '👑 ×5 JACKPOT', color: '#d97706' },
    { ratio: 0.2, mult: 2, label: '×2 ボーナス', color: '#0284c7' },
    { ratio: 0.2, mult: 1, label: '×1 回収', color: '#475569' }
  ];

  function updatePhysics() {
    const grav = 0.21;
    const globalMult = getGlobalMultiplier();

    // Rotate spinners
    for (const sp of spinners) {
      sp.angle += sp.speed;
    }

    // Update balls
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (b.mergeCooldown > 0) b.mergeCooldown--;

      b.vy += grav;
      b.vx *= 0.995;
      b.vy *= 0.995;
      b.x += b.vx;
      b.y += b.vy;
      b.rot += b.vrot;

      // Wall collisions
      if (b.x - b.r < 6) {
        b.x = 6 + b.r;
        b.vx = Math.abs(b.vx) * 0.78;
      } else if (b.x + b.r > W - 6) {
        b.x = W - 6 - b.r;
        b.vx = -Math.abs(b.vx) * 0.78;
      }

      // Bumper collisions
      for (const bmp of bumpers) {
        const dx = b.x - bmp.x;
        const dy = b.y - bmp.y;
        const dist = Math.hypot(dx, dy);
        const minDist = b.r + bmp.r;
        if (dist < minDist && dist > 0.001) {
          const nx = dx / dist;
          const ny = dy / dist;
          b.x = bmp.x + nx * (minDist + 1);
          b.y = bmp.y + ny * (minDist + 1);
          const speed = Math.max(4.8, Math.min(9.5, Math.hypot(b.vx, b.vy) * 1.15));
          b.vx = nx * speed + (Math.random() - 0.5) * 1.2;
          b.vy = ny * speed - 0.8;
          b.vrot = (Math.random() - 0.5) * 0.25;
          b.bounces++;
          bmp.pulse = 1.0;

          // Payout on bumper hit!
          const tierObj = TIERS[b.tier];
          const earn = Math.max(1, Math.floor(tierObj.val * 0.35 * bmp.mult * globalMult));
          recordIncome(earn);
          addFever(1.8);
          playBumperSound(b.tier, bmp.mult);
          addPopup(b.x, b.y - 10, '+' + fmtYen(earn), bmp.color, 0.95);
          addParticles(bmp.x + nx * bmp.r, bmp.y + ny * bmp.r, bmp.color, 5);
        }
      }

      // Spinner bar collisions
      for (const sp of spinners) {
        const dx = b.x - sp.x;
        const dy = b.y - sp.y;
        const dist = Math.hypot(dx, dy);
        if (dist < b.r + sp.len * 0.85) {
          const nx = dx / (dist || 1);
          const ny = dy / (dist || 1);
          b.vx = nx * 4.5 + Math.cos(sp.angle + Math.PI / 2) * 2.2;
          b.vy = ny * 4.5;
        }
      }

      // Bottom Gate Collection
      if (b.y + b.r >= H - 26) {
        const gateIdx = Math.min(GATES.length - 1, Math.max(0, Math.floor((b.x / W) * GATES.length)));
        const gate = GATES[gateIdx];
        const tierObj = TIERS[b.tier];
        const gateBoost = 1 + (state.upgrades.gateBoost - 1) * 0.5;
        const earn = Math.max(1, Math.floor(tierObj.val * gate.mult * gateBoost * globalMult));
        recordIncome(earn);
        addFever(3.2);
        playGateSound();
        addPopup(b.x, H - 36, '回収 +' + fmtYen(earn), gate.mult >= 5 ? '#fde047' : '#34d399', gate.mult >= 5 ? 1.25 : 1.0);
        addParticles(b.x, H - 24, tierObj.color, 8);
        balls.splice(i, 1);
        continue;
      }
    }

    // Ball-to-Ball Collisions & MERGE Evolution!
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i];
        const b = balls[j];
        if (!a || !b) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist < minDist && dist > 0.001) {
          // Check if same tier and eligible to merge!
          if (a.tier === b.tier && a.tier < TIERS.length - 1 && a.mergeCooldown === 0 && b.mergeCooldown === 0) {
            const newTier = a.tier + 1;
            const nt = TIERS[newTier];
            const mx = (a.x + b.x) / 2;
            const my = (a.y + b.y) / 2;

            // Upgrade ball 'a' into the merged higher-tier asset and remove 'b'
            a.tier = newTier;
            a.r = nt.r;
            a.x = mx;
            a.y = my;
            a.vy = -3.8; // Satisfying upward pop on merge
            a.vx = (Math.random() - 0.5) * 3;
            a.mergeCooldown = 12;

            if (newTier > state.maxTierUnlocked) {
              state.maxTierUnlocked = newTier;
              renderEvoBar();
            }

            const mergeBonus = Math.floor(nt.val * 0.8 * globalMult);
            recordIncome(mergeBonus);
            addFever(5.5);
            playMergeSound(newTier);
            addPopup(mx, my - 14, `合体進化！${nt.icon}${nt.name} (+${fmtYen(mergeBonus)})`, '#fde047', 1.2);
            addParticles(mx, my, nt.color, 16);
            shockwaves.push({ x: mx, y: my, r: nt.r, maxR: nt.r * 2.8, color: nt.color, alpha: 1 });

            balls.splice(j, 1);
            j--;
            continue;
          }

          // Elastic bounce between different tiers
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = (minDist - dist) * 0.5;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;

          const kx = a.vx - b.vx;
          const ky = a.vy - b.vy;
          const p = 2 * (nx * kx + ny * ky) / 2;
          a.vx -= p * nx * 0.75;
          a.vy -= p * ny * 0.75;
          b.vx += p * nx * 0.75;
          b.vy += p * ny * 0.75;
        }
      }
    }

    // Update visual effects
    for (const bmp of bumpers) {
      if (bmp.pulse > 0) bmp.pulse = Math.max(0, bmp.pulse - 0.08);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y += p.vy;
      p.alpha -= 0.022;
      if (p.alpha <= 0) popups.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.15;
      pt.alpha -= 0.03;
      if (pt.alpha <= 0) particles.splice(i, 1);
    }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.r += (sw.maxR - sw.r) * 0.22;
      sw.alpha -= 0.06;
      if (sw.alpha <= 0) shockwaves.splice(i, 1);
    }
  }

  // ============================================================================
  // 6. RENDERING (60fps Neon Canvas + Embedded Shorts Header when recording)
  // ============================================================================
  let isShortsMode = false;
  let currentCaptionIdx = 0;

  function drawStage() {
    const isFever = Date.now() < state.feverActiveUntil;

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (isFever) {
      grad.addColorStop(0, '#2e1065');
      grad.addColorStop(0.5, '#1e1b4b');
      grad.addColorStop(1, '#090d16');
    } else {
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#060911');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Subtle cyber grid lines
    ctx.strokeStyle = isFever ? 'rgba(251, 191, 36, 0.08)' : 'rgba(56, 189, 248, 0.05)';
    ctx.lineWidth = 1;
    const step = 36;
    for (let x = 0; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Drop Zone Indicator at Top
    ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
    ctx.fillRect(10, 4, W - 20, 18);
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('▼ タップした位置に臨時投下！同じ資産がぶつかると合体進化 ▼', W / 2, 16);

    // Draw Spinners
    for (const sp of spinners) {
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.rotate(sp.angle);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-sp.len, 0);
      ctx.lineTo(sp.len, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -sp.len);
      ctx.lineTo(0, sp.len);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw Multiplier Bumpers
    for (const bmp of bumpers) {
      const pr = bmp.r + bmp.pulse * 6;
      ctx.save();
      // Outer glow
      ctx.beginPath();
      ctx.arc(bmp.x, bmp.y, pr + 4, 0, Math.PI * 2);
      ctx.fillStyle = bmp.color + '33';
      ctx.fill();

      // Main bumper circle
      ctx.beginPath();
      ctx.arc(bmp.x, bmp.y, pr, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = isFever ? '#fde047' : bmp.color;
      ctx.stroke();

      // Label
      ctx.fillStyle = '#fff';
      ctx.font = `900 ${Math.floor(bmp.r * 0.68)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isFever ? `×${bmp.mult * 2}` : bmp.label, bmp.x, bmp.y + 1);
      ctx.restore();
    }

    // Draw Shockwaves
    for (const sw of shockwaves) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = Math.max(0, sw.alpha);
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    // Draw Balls (Coins / Assets)
    for (const b of balls) {
      const t = TIERS[b.tier];
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);

      // Coin body
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, Math.PI * 2);
      ctx.fillStyle = t.color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = t.ring;
      ctx.stroke();

      // Inner shine
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.82, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Emoji & Value label
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${Math.floor(b.r * 0.85)}px sans-serif`;
      ctx.fillText(t.icon, 0, -b.r * 0.12);

      ctx.font = `900 ${Math.max(8, Math.floor(b.r * 0.44))}px sans-serif`;
      ctx.fillStyle = '#090d16';
      ctx.fillText(t.label, 0, b.r * 0.52);
      ctx.restore();
    }

    // Draw Particles
    for (const pt of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.alpha);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw Bottom Collector Gates
    const gateY = H - 26;
    let gx = 0;
    for (const g of GATES) {
      const gw = W * g.ratio;
      ctx.fillStyle = g.color;
      ctx.fillRect(gx + 1, gateY, gw - 2, 26);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(gx + 1, gateY, gw - 2, 26);

      ctx.fillStyle = '#fff';
      ctx.font = '900 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(g.label, gx + gw / 2, gateY + 13);
      gx += gw;
    }

    // Draw Floating Popups
    for (const p of popups) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font = `900 ${Math.floor(13 * p.scale)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#000';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }

    // When recording a video or in Shorts Mode, also render a sleek HUD directly onto the canvas so recorded videos have captions & live counter baked in!
    if (isRecordingVideo) {
      const cap = SHORTS_CAPTIONS[currentCaptionIdx];
      ctx.save();
      ctx.fillStyle = 'rgba(7, 11, 20, 0.9)';
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.fillRect(10, 8, W - 20, 66);
      ctx.strokeRect(10, 8, W - 20, 66);

      ctx.fillStyle = '#fde047';
      ctx.font = '900 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cap.badge + ' ｜ 総資産: ' + fmtYen(state.money), W / 2, 26);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 13px sans-serif';
      ctx.fillText(cap.text, W / 2, 50);
      ctx.restore();
    }
  }

  // ============================================================================
  // 7. UPGRADE SYSTEM & UI RENDERING
  // ============================================================================
  const FACTORY_UPGRADES = [
    {
      key: 'spawnRate',
      name: '自動投下コンベア高速化',
      icon: '⚙️',
      desc: (lv) => `自動ドロップ間隔を短縮（現在 ${(Math.max(0.22, 1.35 - (lv - 1) * 0.11)).toFixed(2)}秒）`,
      cost: (lv) => Math.floor(30 * Math.pow(1.75, lv - 1)),
      maxLv: 12
    },
    {
      key: 'startTier',
      name: '初期投下コインのランク進化',
      icon: '🪙',
      desc: (lv) => `最初から「${TIERS[Math.min(lv, TIERS.length - 2)].name}」が落ちてくる！`,
      cost: (lv) => Math.floor(250 * Math.pow(4.2, lv)),
      maxLv: 7
    },
    {
      key: 'bumperMult',
      name: 'ネオンバンパー配当ブースト',
      icon: '⚡',
      desc: (lv) => `バンパー衝突＆合体時の獲得金額 +${lv * 45}% UP`,
      cost: (lv) => Math.floor(80 * Math.pow(1.9, lv - 1)),
      maxLv: 25
    },
    {
      key: 'pinCount',
      name: '高倍率バンパー増設工事',
      icon: '🎯',
      desc: (lv) => `ステージ内の高倍率バンパーを増設（Lv.${lv}/4）`,
      cost: (lv) => Math.floor(600 * Math.pow(5.5, lv - 1)),
      maxLv: 4,
      onBuy: () => rebuildBumpers()
    },
    {
      key: 'gateBoost',
      name: '下部ポケット回収倍率強化',
      icon: '👑',
      desc: (lv) => `下部回収ポケットの配当を +${lv * 50}% 強化`,
      cost: (lv) => Math.floor(150 * Math.pow(2.1, lv - 1)),
      maxLv: 20
    }
  ];

  function renderEvoBar() {
    const bar = document.getElementById('evo-bar');
    bar.innerHTML = TIERS.map(t => {
      const unlocked = t.id <= state.maxTierUnlocked;
      return `<div class="evo-item ${unlocked ? 'unlocked' : ''}">
        <span class="evo-icon">${unlocked ? t.icon : '❓'}</span>
        <span class="evo-val">${t.label}</span>
      </div>`;
    }).join('');
  }

  function renderUpgrades() {
    // Tab 1: Factory Upgrades
    const fContainer = document.getElementById('tab-factory');
    fContainer.innerHTML = FACTORY_UPGRADES.map(u => {
      const lv = state.upgrades[u.key] || 0;
      const isMax = lv >= u.maxLv;
      const cost = isMax ? 0 : u.cost(lv);
      const canBuy = !isMax && state.money >= cost;
      return `<div class="upg-row">
        <div class="upg-info">
          <div class="upg-icon">${u.icon}</div>
          <div class="upg-text">
            <div class="upg-title">${u.name} <span class="upg-lvl">Lv.${lv}${isMax ? ' MAX' : ''}</span></div>
            <div class="upg-desc">${u.desc(lv)}</div>
          </div>
        </div>
        <button class="buy-btn" data-upg="${u.key}" ${canBuy ? '' : 'disabled'}>
          ${isMax ? '最大Lv' : fmtYen(cost)}
        </button>
      </div>`;
    }).join('');

    fContainer.querySelectorAll('.buy-btn[data-upg]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-upg');
        const u = FACTORY_UPGRADES.find(x => x.key === key);
        const lv = state.upgrades[key] || 0;
        if (lv >= u.maxLv) return;
        const cost = u.cost(lv);
        if (state.money >= cost) {
          state.money -= cost;
          state.upgrades[key] = lv + 1;
          if (u.onBuy) u.onBuy();
          playMergeSound(Math.min(lv + 2, TIERS.length - 1));
          saveState();
          renderUpgrades();
          updateTopHUD();
        }
      });
    });

    // Tab 2: Real-life God Items
    const iContainer = document.getElementById('tab-invest');
    iContainer.innerHTML = REAL_ITEMS.map(item => {
      const lv = state.realItems[item.id] || 0;
      const cost = Math.floor(item.baseCost * Math.pow(2.15, lv));
      const canBuy = state.money >= cost;
      return `<div class="upg-row">
        <div class="upg-info">
          <div class="upg-icon">${item.icon}</div>
          <div class="upg-text">
            <div class="upg-title">${item.name} <span class="upg-lvl">保有 ${lv}</span></div>
            <div class="upg-desc">秒間 +${fmtYen(item.ppsBoost)} ＆ 全配当 +${Math.round(item.multBoost * 100)}%（${item.paybackText}）</div>
          </div>
        </div>
        <button class="buy-btn" data-real="${item.id}" ${canBuy ? '' : 'disabled'}>
          投資 ${fmtYen(cost)}
        </button>
      </div>`;
    }).join('');

    iContainer.querySelectorAll('.buy-btn[data-real]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-real');
        const item = REAL_ITEMS.find(x => x.id === id);
        const lv = state.realItems[id] || 0;
        const cost = Math.floor(item.baseCost * Math.pow(2.15, lv));
        if (state.money >= cost) {
          state.money -= cost;
          state.realItems[id] = lv + 1;
          playMergeSound(6);
          saveState();
          renderUpgrades();
          renderROIEncyclopedia();
          updateTopHUD();
        }
      });
    });
  }

  function renderROIEncyclopedia() {
    const rContainer = document.getElementById('tab-roi');
    rContainer.innerHTML = REAL_ITEMS.map(item => {
      const lv = state.realItems[item.id] || 0;
      return `<div class="roi-card">
        <div class="roi-top">
          <span class="roi-name">${item.icon} ${item.name} ${lv > 0 ? `（工場に${lv}台導入済）` : ''}</span>
          <span class="roi-badge">${item.paybackText.replace('現実での元取り期間：', '')}</span>
        </div>
        <div class="roi-desc">${item.desc}</div>
        <div class="roi-links">
          <a href="${item.calcUrl}" class="roi-link calc">📊 自分の元取り期間を1秒計算</a>
          <a href="${rakutenUrl(item.rakutenKw)}" target="_blank" rel="nofollow sponsored" class="roi-link rakuten">🛍️ 楽天市場で人気モデルを見る</a>
        </div>
      </div>`;
    }).join('');
  }

  function updateTopHUD() {
    document.getElementById('moneyText').textContent = fmtYen(state.money);
    document.getElementById('ppsText').textContent = `+${fmtYen(getTotalDisplayPPS())} / 秒（全体倍率 ×${getGlobalMultiplier().toFixed(2)}）`;

    const isFever = Date.now() < state.feverActiveUntil;
    const fLabel = document.getElementById('feverLabel');
    const fBar = document.getElementById('feverBar');
    if (isFever) {
      const rem = Math.max(0, ((state.feverActiveUntil - Date.now()) / 1000)).toFixed(1);
      fLabel.textContent = `🌈 FEVER ${rem}s`;
      fBar.style.width = '100%';
    } else {
      fLabel.textContent = `🔥 FEVER ${Math.floor(state.fever)}%`;
      fBar.style.width = `${Math.floor(state.fever)}%`;
    }

    // Refresh button disabled states cheaply
    document.querySelectorAll('.buy-btn[data-upg]').forEach(btn => {
      const key = btn.getAttribute('data-upg');
      const u = FACTORY_UPGRADES.find(x => x.key === key);
      const lv = state.upgrades[key] || 0;
      btn.disabled = (lv >= u.maxLv) || (state.money < u.cost(lv));
    });
    document.querySelectorAll('.buy-btn[data-real]').forEach(btn => {
      const id = btn.getAttribute('data-real');
      const item = REAL_ITEMS.find(x => x.id === id);
      const lv = state.realItems[id] || 0;
      const cost = Math.floor(item.baseCost * Math.pow(2.15, lv));
      btn.disabled = state.money < cost;
    });
  }

  // ============================================================================
  // 8. INTERACTION, SHORTS VIDEO RECORDER & GAME LOOP
  // ============================================================================
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    spawnBall(x);
    addFever(2.5);
  });

  // Burst button
  document.getElementById('btnBurst').addEventListener('click', () => {
    initAudio();
    for (let i = 0; i < 10; i++) {
      setTimeout(() => spawnBall(W * (0.12 + 0.76 * Math.random())), i * 70);
    }
    addFever(15);
  });

  // Sound toggle
  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    btnSound.textContent = soundEnabled ? '🔊 音ON' : '🔇 音OFF';
    if (soundEnabled) initAudio();
  });

  // Shorts Mode toggle
  const btnShorts = document.getElementById('btnShorts');
  const shortsOverlay = document.getElementById('shorts-overlay');
  btnShorts.addEventListener('click', () => {
    isShortsMode = !isShortsMode;
    btnShorts.classList.toggle('active', isShortsMode);
    shortsOverlay.classList.toggle('show', isShortsMode);
    document.getElementById('app').classList.toggle('shorts-clean', isShortsMode);
    setTimeout(setupStageGeometry, 50);
  });

  // Change Shorts Caption
  document.getElementById('btnChangeCaption').addEventListener('click', () => {
    currentCaptionIdx = (currentCaptionIdx + 1) % SHORTS_CAPTIONS.length;
    const cap = SHORTS_CAPTIONS[currentCaptionIdx];
    document.getElementById('shortsBadge').textContent = cap.badge;
    document.getElementById('shortsHeadline').textContent = cap.text;
  });

  // 12-Second Direct Shorts Video Recorder (Canvas + WebAudio -> .webm download)
  let isRecordingVideo = false;
  const btnRecordVideo = document.getElementById('btnRecordVideo');
  btnRecordVideo.addEventListener('click', () => {
    if (isRecordingVideo) return;
    initAudio();
    if (!canvas.captureStream) {
      alert('お使いのブラウザはCanvas録画に対応していません。PC版Chrome等でお試しください。');
      return;
    }
    isRecordingVideo = true;
    btnRecordVideo.textContent = '⏺️ 録画中... (残り12秒)';

    // Trigger an exciting gold shower right as recording starts!
    state.feverActiveUntil = Date.now() + 12000;
    for (let i = 0; i < 12; i++) {
      setTimeout(() => spawnBall(W * (0.15 + 0.7 * (i / 11))), i * 110);
    }

    const canvasStream = canvas.captureStream(30);
    if (audioDest) {
      const audioTracks = audioDest.stream.getAudioTracks();
      if (audioTracks.length > 0) canvasStream.addTrack(audioTracks[0]);
    }

    let mimeType = 'video/webm;codecs=vp9,opus';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    const recorder = new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: 5000000 });
    const chunks = [];
    recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
    recorder.onstop = () => {
      isRecordingVideo = false;
      btnRecordVideo.textContent = '🔴 12秒ショート動画を録画保存';
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `money_drop_shorts_${Date.now()}.webm`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };

    recorder.start(200);
    let secLeft = 12;
    const timer = setInterval(() => {
      secLeft--;
      if (secLeft > 0) {
        btnRecordVideo.textContent = `⏺️ 録画中... (残り${secLeft}秒)`;
      } else {
        clearInterval(timer);
        if (recorder.state === 'recording') recorder.stop();
      }
    }, 1000);
  });

  // Tabs switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  // Main Loop & Timers
  let lastAutoSpawn = performance.now();
  let lastPassiveTick = performance.now();
  let lastHUDUpdate = performance.now();

  function loop(now) {
    const spawnIntervalMs = Math.max(220, 1350 - ((state.upgrades.spawnRate || 1) - 1) * 110);
    const effectiveInterval = (Date.now() < state.feverActiveUntil) ? spawnIntervalMs * 0.45 : spawnIntervalMs;

    if (now - lastAutoSpawn >= effectiveInterval) {
      spawnBall();
      lastAutoSpawn = now;
    }

    if (now - lastPassiveTick >= 1000) {
      const pps = getPassivePPS();
      if (pps > 0) {
        state.money += pps;
        state.totalEarned += pps;
      }
      lastPassiveTick = now;
    }

    updatePhysics();
    drawStage();

    if (now - lastHUDUpdate >= 180) {
      updateTopHUD();
      lastHUDUpdate = now;
    }

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', setupStageGeometry);
  setInterval(saveState, 5000);

  // Initialize
  setupStageGeometry();
  renderEvoBar();
  renderUpgrades();
  renderROIEncyclopedia();
  updateTopHUD();
  // Drop initial celebratory coins
  for (let i = 0; i < 4; i++) {
    setTimeout(() => spawnBall(), i * 180);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
