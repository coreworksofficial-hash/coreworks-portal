<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>瞬間脳トレ！違和感探し</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
    color: #f8fafc;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Meiryo", sans-serif;
    touch-action: manipulation;
  }
  #app {
    width: 100%;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 16px 16px;
    position: relative;
  }

  /* 1. Top Seek/Timer Progress Bar (Identical to YouTube Video) */
  #top-progress-wrap {
    width: calc(100% + 32px);
    margin-left: -16px;
    height: 8px;
    background: rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
  }
  #top-progress-bar {
    height: 100%;
    width: 100%;
    background: #34d399;
    transition: width 0.08s linear, background-color 0.2s;
  }

  /* 2. Top Badge Row */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .top-badge {
    background: #f59e0b;
    color: #052e16;
    font-size: 15px;
    font-weight: 900;
    padding: 7px 16px;
    border-radius: 99px;
    letter-spacing: -0.2px;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
  }
  .sound-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.85);
    border: 2px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* 3. Headlines + 3-Question Step Dots */
  .headlines {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .headline-left {
    display: flex;
    flex-direction: column;
  }
  .headline-1 {
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.22;
    letter-spacing: -0.5px;
  }
  .headline-2 {
    font-size: 25px;
    font-weight: 900;
    color: #fbbf24;
    line-height: 1.22;
    letter-spacing: -0.5px;
  }
  .step-pill {
    background: rgba(30, 41, 59, 0.9);
    border: 2px solid rgba(251, 191, 36, 0.45);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 15px;
    font-weight: 900;
    color: #fde047;
    white-space: nowrap;
  }

  /* 4. Status / Countdown Banner (Identical to YouTube Video) */
  #status-banner {
    width: 100%;
    height: 54px;
    border-radius: 14px;
    background: rgba(239, 68, 68, 0.2);
    border: 2px solid rgba(248, 113, 113, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #f87171;
    margin-bottom: 12px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  #status-banner.correct {
    background: rgba(16, 185, 129, 0.25);
    border-color: #34d399;
    color: #34d399;
  }
  #status-banner.reveal {
    background: rgba(245, 158, 11, 0.25);
    border-color: #fbbf24;
    color: #fde047;
  }

  /* 5. Main Kanji/Character Grid */
  #grid-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #grid {
    width: 100%;
    height: 100%;
    max-height: 500px;
    display: grid;
    gap: 8px;
  }
  .cell {
    background: rgba(30, 41, 59, 0.88);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f8fafc;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.08s ease, background-color 0.15s ease, opacity 0.2s ease;
  }
  .cell:active {
    transform: scale(0.93);
  }
  .cell.correct-cell {
    background: #10b981 !important;
    border-color: #6ee7b7 !important;
    color: #052e16 !important;
    transform: scale(1.04);
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
  }
  .cell.wrong-cell {
    background: rgba(239, 68, 68, 0.45);
    border-color: #f87171;
  }
  .cell.dimmed {
    opacity: 0.18;
    pointer-events: none;
  }

  /* 6. Bottom Footer Bar */
  #footer-bar {
    margin-top: 12px;
    background: rgba(56, 189, 248, 0.15);
    border: 2px solid #38bdf8;
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .rank-info {
    font-size: 15px;
    font-weight: 900;
    color: #f8fafc;
  }
  .hint-btn {
    background: #38bdf8;
    color: #090d16;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hint-btn:disabled {
    background: #334155;
    color: #64748b;
    cursor: not-allowed;
  }

  /* Stage Clear / Retry Modal */
  #modal {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(9, 13, 22, 0.88);
    z-index: 30;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #modal.show {
    display: flex;
  }
  .modal-card {
    width: 100%;
    max-width: 400px;
    background: #1e293b;
    border: 3px solid #fbbf24;
    border-radius: 22px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
  }
  .modal-badge {
    display: inline-block;
    background: #f59e0b;
    color: #052e16;
    font-size: 14px;
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 10px;
  }
  .modal-title {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 4px;
  }
  .modal-iq {
    font-size: 38px;
    font-weight: 900;
    color: #34d399;
    margin: 8px 0;
  }
  .modal-sub {
    font-size: 16px;
    color: #cbd5e1;
    margin-bottom: 20px;
    line-height: 1.45;
  }
  .primary-btn {
    width: 100%;
    background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    color: #052e16;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
  }
  .primary-btn:active {
    transform: scale(0.97);
  }
  .reset-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    color: #94a3b8;
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <!-- 1. Top Progress Bar -->
  <div id="top-progress-wrap">
    <div id="top-progress-bar"></div>
  </div>

  <!-- 2. Top Badge & Sound -->
  <div class="header-row">
    <div class="top-badge" id="stageBadge">🧠 STAGE 1 ｜ 脳トレIQ 100</div>
    <button class="sound-btn" id="soundBtn" aria-label="音量">🔊</button>
  </div>

  <!-- 3. Headlines & Step Indicator (1/3, 2/3, 3/3) -->
  <div class="headlines">
    <div class="headline-left">
      <div class="headline-1">1つだけ違う文字を</div>
      <div class="headline-2">制限時間内にタップ！</div>
    </div>
    <div class="step-pill" id="stepPill">第 1 / 3 問</div>
  </div>

  <!-- 4. Countdown / Answer Status Banner -->
  <div id="status-banner">⏱️ 残り 10.0 秒！</div>

  <!-- 5. Clean Character Grid -->
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>

  <!-- 6. Bottom Footer -->
  <div id="footer-bar">
    <div class="rank-info" id="rankText">🏅 称号：観察ルーキー</div>
    <button class="hint-btn" id="hintBtn">💡 ヒント (3)</button>
  </div>

  <!-- Stage Clear / Retry Modal -->
  <div id="modal">
    <div class="modal-card">
      <div class="modal-badge" id="modalBadge">🎉 STAGE CLEAR!</div>
      <div class="modal-title" id="modalTitle">STAGE 1 クリア！</div>
      <div class="modal-iq" id="modalIQ">認定IQ 105</div>
      <div class="modal-sub" id="modalComment">称号：観察ルーキー</div>
      <button class="primary-btn" id="modalActionBtn">▶️ STAGE 2 へ進む</button>
      <button class="reset-link" id="resetStageBtn">STAGE 1 からやり直す</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ============================================================================
  // 1. EXPANDED CURATED PUZZLE POOL (60 Pairs across 4 Difficulty Tiers)
  // ============================================================================
  const PUZZLES = [
    // Tier 1 (Easy / Warmup)
    { normal: '大', odd: '太' }, { normal: '日', odd: '目' },
    { normal: '人', odd: '入' }, { normal: '土', odd: '士' },
    { normal: '白', odd: '百' }, { normal: '王', odd: '玉' },
    { normal: '刀', odd: '力' }, { normal: '千', odd: '干' },
    { normal: '牛', odd: '午' }, { normal: '木', odd: '本' },
    { normal: '犬', odd: '太' }, { normal: '上', odd: '土' },
    { normal: '口', odd: '日' }, { normal: '子', odd: '字' },
    { normal: '水', odd: '氷' },

    // Tier 2 (Medium)
    { normal: '氷', odd: '永' }, { normal: '未', odd: '末' },
    { normal: '休', odd: '体' }, { normal: '名', odd: '各' },
    { normal: '右', odd: '石' }, { normal: '貝', odd: '見' },
    { normal: '田', odd: '由' }, { normal: '甲', odd: '申' },
    { normal: '古', odd: '吉' }, { normal: '宇', odd: '字' },
    { normal: '皿', odd: '血' }, { normal: '自', odd: '白' },
    { normal: '住', odd: '主' }, { normal: '池', odd: '地' },
    { normal: '枚', odd: '牧' },

    // Tier 3 (Hard)
    { normal: '待', odd: '持' }, { normal: '鳥', odd: '烏' },
    { normal: '季', odd: '李' }, { normal: '問', odd: '間' },
    { normal: '晴', odd: '睛' }, { normal: '往', odd: '住' },
    { normal: '柱', odd: '注' }, { normal: '複', odd: '復' },
    { normal: '綱', odd: '網' }, { normal: '壁', odd: '璧' },
    { normal: '快', odd: '決' }, { normal: '涼', odd: '京' },
    { normal: '功', odd: '巧' }, { normal: '矢', odd: '失' },
    { normal: '辛', odd: '幸' },

    // Tier 4 (Genius / Master - includes 微 vs 徴 from the YouTube Shorts video!)
    { normal: '微', odd: '徴' }, { normal: '鏡', odd: '境' },
    { normal: '簿', odd: '薄' }, { normal: '緑', odd: '縁' },
    { normal: '輪', odd: '輸' }, { normal: '燥', odd: '噪' },
    { normal: '崇', odd: '祟' }, { normal: '塊', odd: '魂' },
    { normal: '暦', odd: '歴' }, { normal: '穫', odd: '獲' },
    { normal: '偏', odd: '編' }, { normal: '愉', odd: '諭' },
    { normal: '障', odd: '彰' }, { normal: '賠', odd: '培' },
    { normal: '騰', odd: '謄' }
  ];

  function getTitleForIQ(iqVal) {
    if (iqVal >= 170) return '🪐 神の領域（上位0.01%）';
    if (iqVal >= 150) return '👑 瞬間認識の天才（上位0.1%）';
    if (iqVal >= 135) return '🦅 鷹の目マスター（上位1%）';
    if (iqVal >= 125) return '💎 脳トレ名人（上位5%）';
    if (iqVal >= 115) return '🔥 違和感ハンター';
    if (iqVal >= 106) return '✨ 観察プロ';
    return '🌱 観察ルーキー';
  }

  // ============================================================================
  // 2. WEB AUDIO SYNTH (Clean Chimes & Stage Clear Fanfare)
  // ============================================================================
  let audioCtx = null;
  let soundOn = true;

  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTickSound() {
    if (!soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, now);
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }

  function playCorrectSound() {
    if (!soundOn) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [587.33, 880.0].forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.1);
      gain.gain.setValueAtTime(0.22, now + idx * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.1);
      osc.stop(now + idx * 0.1 + 0.27);
    });
  }

  function playStageClearFanfare() {
    if (!soundOn) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.09);
      gain.gain.setValueAtTime(0.24, now + idx * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.09);
      osc.stop(now + idx * 0.09 + 0.37);
    });
  }

  function playWrongSound() {
    if (!soundOn) return;
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.setValueAtTime(140, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.19);
  }

  // ============================================================================
  // 3. PERSISTENT STAGE PROGRESSION STATE
  // ============================================================================
  const SAVE_KEY = 'cw_kanji_stage_save_v2';
  const QUESTIONS_PER_STAGE = 3;

  let state = {
    stage: 1,
    iq: 100,
    hints: 3
  };

  function loadProgress() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.stage >= 1) state.stage = parsed.stage;
        if (parsed.iq >= 100) state.iq = parsed.iq;
        if (typeof parsed.hints === 'number') state.hints = Math.max(1, parsed.hints);
      }
    } catch (e) {}
  }

  function saveProgress() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  loadProgress();

  let stepInStage = 1; // 1, 2, or 3
  let timeLimit = 10.0;
  let timeRemaining = 10.0;
  let oddIndex = 0;
  let currentPair = PUZZLES[0];
  let isQuestionActive = false;
  let timerId = null;
  let lastTickSec = 10;
  let lastPuzzleNormal = '';

  const gridEl = document.getElementById('grid');
  const bannerEl = document.getElementById('status-banner');
  const progBarEl = document.getElementById('top-progress-bar');
  const stageBadgeEl = document.getElementById('stageBadge');
  const stepPillEl = document.getElementById('stepPill');
  const rankTextEl = document.getElementById('rankText');
  const hintBtnEl = document.getElementById('hintBtn');
  const modalEl = document.getElementById('modal');

  function getGridConfig(st) {
    if (st === 1) return { cols: 3, rows: 3, fontPx: 46 }; // 9マス
    if (st === 2) return { cols: 3, rows: 4, fontPx: 42 }; // 12マス
    if (st <= 4)  return { cols: 4, rows: 4, fontPx: 38 }; // 16マス
    if (st <= 6)  return { cols: 4, rows: 5, fontPx: 34 }; // 20マス
    if (st <= 9)  return { cols: 5, rows: 5, fontPx: 30 }; // 25マス
    return { cols: 5, rows: 6, fontPx: 28 };               // 30マス (YouTube動画と同一)
  }

  function pickPuzzle(st) {
    let pool;
    if (st <= 2) pool = PUZZLES.slice(0, 15);
    else if (st <= 5) pool = PUZZLES.slice(10, 30);
    else if (st <= 9) pool = PUZZLES.slice(25, 45);
    else pool = PUZZLES.slice(35);

    let chosen = pool[Math.floor(Math.random() * pool.length)];
    for (let tries = 0; tries < 5; tries++) {
      if (chosen.normal !== lastPuzzleNormal) break;
      chosen = pool[Math.floor(Math.random() * pool.length)];
    }
    lastPuzzleNormal = chosen.normal;

    return Math.random() < 0.5
      ? { normal: chosen.normal, odd: chosen.odd }
      : { normal: chosen.odd, odd: chosen.normal };
  }

  function updateHUD() {
    stageBadgeEl.textContent = `🧠 STAGE ${state.stage} ｜ 脳トレIQ ${state.iq}`;
    stepPillEl.textContent = `第 ${stepInStage} / ${QUESTIONS_PER_STAGE} 問`;
    rankTextEl.textContent = `🏅 ${getTitleForIQ(state.iq)}`;
    hintBtnEl.textContent = `💡 ヒント (${state.hints})`;
    hintBtnEl.disabled = !isQuestionActive || state.hints <= 0;
  }

  function startQuestion() {
    clearInterval(timerId);
    modalEl.classList.remove('show');
    isQuestionActive = true;

    const { cols, rows, fontPx } = getGridConfig(state.stage);
    const total = cols * rows;
    currentPair = pickPuzzle(state.stage);
    oddIndex = Math.floor(Math.random() * total);

    // 10s on early stages, gradually tightening to 7.5s on advanced stages
    timeLimit = Math.max(7.5, 10.5 - Math.floor(state.stage / 5) * 0.5);
    timeRemaining = timeLimit;
    lastTickSec = Math.ceil(timeRemaining);

    bannerEl.className = '';
    bannerEl.textContent = `⏱️ 残り ${timeRemaining.toFixed(1)} 秒！`;
    progBarEl.style.width = '100%';
    progBarEl.style.backgroundColor = '#34d399';

    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    gridEl.innerHTML = '';

    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.fontSize = `${fontPx}px`;
      cell.textContent = (i === oddIndex) ? currentPair.odd : currentPair.normal;
      cell.addEventListener('pointerdown', () => onCellTap(i, cell));
      gridEl.appendChild(cell);
    }

    updateHUD();

    const startTime = performance.now();
    timerId = setInterval(() => {
      if (!isQuestionActive) return;
      const elapsed = (performance.now() - startTime) / 1000;
      timeRemaining = Math.max(0, timeLimit - elapsed);

      const ratio = (timeRemaining / timeLimit) * 100;
      progBarEl.style.width = `${ratio}%`;
      if (timeRemaining <= 3.0) {
        progBarEl.style.backgroundColor = '#f87171';
      }

      const secInt = Math.ceil(timeRemaining);
      if (secInt < lastTickSec && secInt > 0) {
        lastTickSec = secInt;
        playTickSound();
      }

      bannerEl.textContent = `⏱️ 残り ${timeRemaining.toFixed(1)} 秒！`;

      if (timeRemaining <= 0) {
        onTimeUp();
      }
    }, 50);
  }

  function onCellTap(index, cellEl) {
    if (!isQuestionActive) return;
    initAudio();

    if (index === oddIndex) {
      isQuestionActive = false;
      clearInterval(timerId);
      cellEl.classList.add('correct-cell');

      const clearSec = Math.max(0.2, timeLimit - timeRemaining).toFixed(1);
      const iqGain = timeRemaining >= timeLimit * 0.6 ? 2 : 1;
      state.iq += iqGain;

      bannerEl.className = 'correct';
      bannerEl.textContent = `🎉 正解！ ${clearSec}秒で発見！`;
      updateHUD();

      if (stepInStage < QUESTIONS_PER_STAGE) {
        playCorrectSound();
        setTimeout(() => {
          stepInStage++;
          startQuestion();
        }, 950);
      } else {
        // STAGE CLEAR! (3/3 completed)
        playStageClearFanfare();
        const clearedStage = state.stage;
        state.stage++;
        state.iq += 2; // Stage clear bonus IQ
        state.hints = Math.min(5, state.hints + 1); // Recover +1 hint on every stage clear!
        saveProgress();
        updateHUD();

        setTimeout(() => {
          showModal({
            badge: '🎉 STAGE CLEAR!',
            title: `STAGE ${clearedStage} クリア！`,
            iqText: `認定IQ ${state.iq}`,
            comment: `${getTitleForIQ(state.iq)}<br>（💡ヒントが1つ回復しました！）`,
            btnText: `▶️ STAGE ${state.stage} へ進む`
          });
        }, 1000);
      }
    } else {
      playWrongSound();
      cellEl.classList.add('wrong-cell');
      setTimeout(() => cellEl.classList.remove('wrong-cell'), 300);
    }
  }

  function onTimeUp() {
    isQuestionActive = false;
    clearInterval(timerId);
    playWrongSound();

    const cells = gridEl.querySelectorAll('.cell');
    if (cells[oddIndex]) {
      cells[oddIndex].classList.add('correct-cell');
    }

    bannerEl.className = 'reveal';
    bannerEl.textContent = `👀 正解はココでした！（${currentPair.odd}）`;
    updateHUD();

    // Ensure player has at least 2 hints on retry so they never get stuck!
    if (state.hints < 2) {
      state.hints = 2;
      saveProgress();
    }

    setTimeout(() => {
      showModal({
        badge: '⏱️ TIME UP!',
        title: `STAGE ${state.stage}（第${stepInStage}問）`,
        iqText: `現在のIQ ${state.iq}`,
        comment: `今回の違いは「${currentPair.normal}」の中の「${currentPair.odd}」でした！<br>進行度は保存されているので、そのまま再挑戦できます。`,
        btnText: `🔄 STAGE ${state.stage} を再挑戦する`
      });
    }, 1500);
  }

  function showModal({ badge, title, iqText, comment, btnText }) {
    document.getElementById('modalBadge').textContent = badge;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalIQ').textContent = iqText;
    document.getElementById('modalComment').innerHTML = comment;
    document.getElementById('modalActionBtn').textContent = btnText;
    modalEl.classList.add('show');
  }

  // Primary modal button (Next Stage OR Retry Current Stage)
  document.getElementById('modalActionBtn').addEventListener('click', () => {
    initAudio();
    stepInStage = 1;
    startQuestion();
  });

  // Optional reset to Stage 1
  document.getElementById('resetStageBtn').addEventListener('click', () => {
    initAudio();
    state.stage = 1;
    state.iq = 100;
    state.hints = 3;
    stepInStage = 1;
    saveProgress();
    startQuestion();
  });

  // Hint button: dims half of remaining normal tiles
  hintBtnEl.addEventListener('click', () => {
    if (!isQuestionActive || state.hints <= 0) return;
    initAudio();
    state.hints--;
    saveProgress();
    const cells = Array.from(gridEl.querySelectorAll('.cell'));
    const normalCandidates = cells
      .map((el, idx) => ({ el, idx }))
      .filter(x => x.idx !== oddIndex && !x.el.classList.contains('dimmed'));

    normalCandidates.sort(() => Math.random() - 0.5);
    const countToDim = Math.max(2, Math.floor(normalCandidates.length * 0.5));
    for (let i = 0; i < countToDim && i < normalCandidates.length; i++) {
      normalCandidates[i].el.classList.add('dimmed');
    }
    updateHUD();
  });

  // Sound toggle
  document.getElementById('soundBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) initAudio();
  });

  // Launch immediately into the player's current saved stage!
  startQuestion();
})();
</script>
</body>
</html>
